# ---------------------------------------------------------------------------
# GitOps Repository CI Pipeline
#
# Triggered on every push to the main branch.
#
# Purpose:
# Validate Kubernetes + Helm configuration BEFORE ArgoCD syncs it.
#
# Jobs (in order):
# 1. validate-yaml     — YAML syntax validation
# 2. helm-lint         — Helm chart linting
# 3. helm-template     — Render manifests from Helm templates
# 4. kubeconform       — Kubernetes schema validation
# 5. security-scan     — Trivy scan for Kubernetes misconfigurations
# 6. kind-deployment   — Deploy chart into local Kind cluster in CI
# 7. smoke-test        — Verify pods/services/ingress become healthy
# 8. notify            — Pipeline summary email
# ---------------------------------------------------------------------------

name: GitOps CI Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # Job 1 — YAML Validation
  # ---------------------------------------------------------------------------
  validate-yaml:
    name: Validate YAML — syntax validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yamllint
        run: |
          pip install yamllint

      - name: Validate YAML files
        run: |
          yamllint . \
            -d '{extends: default, rules: {line-length: disable}}'

  # ---------------------------------------------------------------------------
  # Job 2 — Helm Lint
  # ---------------------------------------------------------------------------
  helm-lint:
    name: Helm Lint — chart best practices
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [validate-yaml]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.1

      - name: Lint Helm chart
        run: |
          helm lint ./lingua-app

  # ---------------------------------------------------------------------------
  # Job 3 — Helm Template Rendering
  # ---------------------------------------------------------------------------
  helm-template:
    name: Helm Template — manifest rendering
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [helm-lint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.1

      - name: Render Kubernetes manifests
        run: |
          helm template lingua-app ./lingua-app > rendered-manifests.yaml

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests
          path: rendered-manifests.yaml

  # ---------------------------------------------------------------------------
  # Job 4 — Kubernetes Schema Validation
  #
  # kubeconform validates manifests against the Kubernetes API schema.
  # This catches invalid fields BEFORE ArgoCD tries to sync.
  # ---------------------------------------------------------------------------
  kubeconform:
    name: Kubernetes Validation — kubeconform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [helm-template]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.1

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate rendered manifests
        run: |
          helm template lingua-app ./lingua-app > rendered.yaml

          kubeconform \
            -strict \
            -summary \
            rendered.yaml

  # ---------------------------------------------------------------------------
  # Job 5 — Security Scan
  #
  # Trivy scans Kubernetes manifests for security misconfigurations.
  # Examples:
  # - privileged containers
  # - latest tags
  # - missing resource limits
  # - insecure capabilities
  # ---------------------------------------------------------------------------
  security-scan:
    name: Security Scan — Trivy Kubernetes scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [kubeconform]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
            | gpg --dearmor \
            | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" \
            | sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Scan Helm chart
        run: |
          trivy config ./lingua-app \
            --severity HIGH,CRITICAL \
            --exit-code 1

  # ---------------------------------------------------------------------------
  # Job 6 — Kind Deployment Test
  #
  # Creates a temporary Kubernetes cluster inside GitHub Actions,
  # installs the Helm chart, and verifies deployment succeeds.
  # ---------------------------------------------------------------------------
  kind-deployment:
    name: Kind Deployment — real Kubernetes deployment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [security-scan]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Kind cluster
        uses: helm/kind-action@v1

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.1

      - name: Install ingress-nginx
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml

          kubectl wait \
            --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=180s

      - name: Deploy Helm chart
        run: |
          helm install lingua-app ./lingua-app \
            --namespace lingua-app \
            --create-namespace

      - name: Wait for deployments
        run: |
          kubectl rollout status deployment/lingua-app-backend \
            -n lingua-app \
            --timeout=180s

          kubectl rollout status deployment/lingua-app-nginx \
            -n lingua-app \
            --timeout=180s

      - name: Print Kubernetes resources
        if: always()
        run: |
          kubectl get all -n lingua-app
          kubectl get ingress -n lingua-app

  # ---------------------------------------------------------------------------
  # Job 7 — Smoke Tests
  # ---------------------------------------------------------------------------
  smoke-test:
    name: Smoke Tests — service verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [kind-deployment]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Kind cluster
        uses: helm/kind-action@v1

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.1

      - name: Install ingress-nginx
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml

          kubectl wait \
            --namespace ingress-nginx \
            --for=condition=ready pod \
            --selector=app.kubernetes.io/component=controller \
            --timeout=180s

      - name: Deploy application
        run: |
          helm install lingua-app ./lingua-app \
            --namespace lingua-app \
            --create-namespace

      - name: Wait for pods
        run: |
          kubectl wait \
            --for=condition=ready pod \
            --all \
            -n lingua-app \
            --timeout=180s

      - name: Verify backend service exists
        run: |
          kubectl get svc -n lingua-app

      - name: Verify ingress exists
        run: |
          kubectl get ingress -n lingua-app

      - name: Verify pods are healthy
        run: |
          kubectl get pods -n lingua-app

          kubectl describe pods -n lingua-app

  # ---------------------------------------------------------------------------
  # Job 8 — Final Pipeline Report
  # ---------------------------------------------------------------------------
  notify:
    name: Notify — full pipeline report
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 10
    needs:
      [
        validate-yaml,
        helm-lint,
        helm-template,
        kubeconform,
        security-scan,
        kind-deployment,
        smoke-test
      ]

    steps:
      - name: Send pipeline summary email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: >
            [${{ github.repository }}] GitOps Pipeline —
            ${{
              needs.validate-yaml.result == 'success' &&
              needs.helm-lint.result == 'success' &&
              needs.helm-template.result == 'success' &&
              needs.kubeconform.result == 'success' &&
              needs.security-scan.result == 'success' &&
              needs.kind-deployment.result == 'success' &&
              needs.smoke-test.result == 'success'
              && '✅ Passed'
              || '❌ Failed'
            }}

          html_body: |
            <!DOCTYPE html>
            <html lang="en">
            <body style="font-family:Arial,sans-serif;background:#f4f4f4;padding:30px;">
              <table width="600" align="center" style="background:white;border-radius:10px;padding:30px;border:1px solid #ddd;">
                <tr>
                  <td>
                    <h1>
                      GitOps Pipeline Summary
                    </h1>

                    <p><strong>Repository:</strong> ${{ github.repository }}</p>
                    <p><strong>Branch:</strong> ${{ github.ref_name }}</p>
                    <p><strong>Commit:</strong> ${{ github.sha }}</p>

                    <hr>

                    <h2>Stages</h2>

                    <ul>
                      <li>Validate YAML → ${{ needs.validate-yaml.result }}</li>
                      <li>Helm Lint → ${{ needs.helm-lint.result }}</li>
                      <li>Helm Template → ${{ needs.helm-template.result }}</li>
                      <li>Kubernetes Validation → ${{ needs.kubeconform.result }}</li>
                      <li>Security Scan → ${{ needs.security-scan.result }}</li>
                      <li>Kind Deployment → ${{ needs.kind-deployment.result }}</li>
                      <li>Smoke Tests → ${{ needs.smoke-test.result }}</li>
                    </ul>

                    <p>
                      <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">
                        View Full Pipeline Run
                      </a>
                    </p>
                  </td>
                </tr>
              </table>
            </body>
            </html>

          to: ${{ secrets.EMAIL_USERNAME }}
          from: "Lingua GitOps CI <${{ secrets.EMAIL_USERNAME }}>"