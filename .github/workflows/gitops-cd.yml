name: GitOps CD Tests

# CD tests validate the *deployed staging environment* - the wiring CI cannot
# see (real DocumentDB TLS, Secrets Manager values, ALB/DNS, OAuth config).
# CI already covers build, unit, integration and e2e tests of the code itself.
#
# Trigger model:
#   - Deploy path: runs 2 minutes after "GitOps CI Pipeline" succeeds on main
#     (smoke -> API acceptance + monitoring + cert expiry; rollback drill on
#     every 5th deploy).
#   - Weekly path: performance tests only, Mondays 06:00 UTC.
#   - Manual: workflow_dispatch lets you pick either suite.
#
# Cluster-dependent jobs (monitoring, rollback drill) authenticate to AWS via
# GitHub OIDC. They are skipped with a notice until the AWS_OIDC_ROLE_ARN
# secret is set (an IAM role trusting this repo, with eks:DescribeCluster and
# a Kubernetes RBAC mapping for kubectl).

on:
  workflow_run:
    workflows: ["GitOps CI Pipeline"]
    types: [completed]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC - weekly performance tests
  workflow_dispatch:
    inputs:
      mode:
        description: Which suite to run
        type: choice
        options:
          - deploy-tests
          - performance
        default: deploy-tests

permissions:
  contents: read
  # id-token: write is granted per-job below (setup, monitoring-checks,
  # rollback-drill only) instead of here - those are the only jobs that
  # actually authenticate to AWS via OIDC, and this is what a security scan
  # (zizmor) flagged as unnecessarily broad when set workflow-wide.

env:
  BASE_URL: https://staging.volt-app.dev
  HOSTNAME: staging.volt-app.dev
  AWS_REGION: ap-south-1
  EKS_CLUSTER: energy-drain-staging
  ARGOCD_APP: energy-drain-staging
  APP_NAMESPACE: energy-drain-staging

jobs:
  # ---------------------------------------------------------------- setup --
  setup:
    name: Plan run & wait for ArgoCD
    runs-on: ubuntu-latest
    permissions:
      id-token: write # for AWS OIDC (sync-wait step assumes AWS_OIDC_ROLE_ARN)
    # Deploy path only when CI succeeded; schedule/dispatch always run.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      deploy_tests: ${{ steps.plan.outputs.deploy_tests }}
      performance: ${{ steps.plan.outputs.performance }}
      rollback_drill: ${{ steps.plan.outputs.rollback_drill }}
      cluster_access: ${{ steps.plan.outputs.cluster_access }}
    steps:
      - name: Decide which suites run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          CI_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          HAS_AWS_ROLE: ${{ secrets.AWS_OIDC_ROLE_ARN != '' }}
        run: |
          DEPLOY=false PERF=false DRILL=false
          case "$EVENT" in
            workflow_run) DEPLOY=true ;;
            schedule) PERF=true ;;
            workflow_dispatch)
              if [ "$MODE" = "performance" ]; then PERF=true; else DEPLOY=true; fi ;;
          esac
          # Rollback drill on every 5th CI deploy (CI run number % 5 == 0)
          if [ "$DEPLOY" = true ] && [ -n "$CI_RUN_NUMBER" ] \
             && [ $((CI_RUN_NUMBER % 5)) -eq 0 ]; then
            DRILL=true
          fi
          {
            echo "deploy_tests=$DEPLOY"
            echo "performance=$PERF"
            echo "rollback_drill=$DRILL"
            echo "cluster_access=$HAS_AWS_ROLE"
          } >> "$GITHUB_OUTPUT"
          echo "deploy_tests=$DEPLOY performance=$PERF rollback_drill=$DRILL cluster_access=$HAS_AWS_ROLE"

      - name: Configure AWS credentials (OIDC)
        if: github.event_name == 'workflow_run' && steps.plan.outputs.cluster_access == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up kubeconfig
        if: github.event_name == 'workflow_run' && steps.plan.outputs.cluster_access == 'true'
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: Wait for ArgoCD to sync the new revision
        if: github.event_name == 'workflow_run'
        run: |
          if kubectl get application "$ARGOCD_APP" -n argocd > /dev/null 2>&1; then
            echo "Cluster access available - polling ArgoCD until Synced + Healthy"
            kubectl wait application "$ARGOCD_APP" -n argocd \
              --for=jsonpath='{.status.sync.status}'=Synced --timeout=300s
            kubectl wait application "$ARGOCD_APP" -n argocd \
              --for=jsonpath='{.status.health.status}'=Healthy --timeout=300s
          else
            echo "No cluster access - sleeping 120s as fallback"
            sleep 120
          fi

  # ---------------------------------------------------------------- smoke --
  smoke-tests:
    name: Smoke tests
    needs: setup
    if: needs.setup.outputs.deploy_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # for AWS OIDC (temporary staging ALB access)
    steps:
      - name: DNS resolves
        run: |
          getent hosts "$HOSTNAME" || { echo "::error::DNS resolution failed for $HOSTNAME"; exit 1; }

      - name: Configure AWS credentials (OIDC)
        if: needs.setup.outputs.cluster_access == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Staging's ALB only accepts traffic from a fixed IP plus whichever
      # runner is actively testing it (see values-staging.yaml's
      # inbound-cidrs). Each job here is a separate VM with its own IP, so
      # this has to run per-job, not once for the whole workflow.
      - name: Authorize this runner's IP on the staging ALB (temporary)
        if: needs.setup.outputs.cluster_access == 'true'
        # RUNNER_IP/SG_ID are regex-validated immediately below before either
        # is written, closing the injection vector this rule flags -
        # zizmor's static analysis can't see that.
        run: | # zizmor: ignore[github-env]
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          if ! [[ "$RUNNER_IP" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo "::warning::could not determine a valid runner IP ($RUNNER_IP) - skipping ALB authorization"
          else
            aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION" > /dev/null
            ALB_DNS=$(kubectl get ingress -n "$APP_NAMESPACE" \
              -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
            SG_ID=""
            if [ -n "$ALB_DNS" ]; then
              CANDIDATE_SGS=$(aws elbv2 describe-load-balancers --region "$AWS_REGION" \
                --query "LoadBalancers[?DNSName=='${ALB_DNS}'].SecurityGroups[]" --output text)
              SG_ID=$(aws ec2 describe-security-groups --region "$AWS_REGION" \
                --group-ids $CANDIDATE_SGS \
                --filters "Name=tag:ingress.k8s.aws/resource,Values=ManagedLBSecurityGroup" \
                --query 'SecurityGroups[0].GroupId' --output text)
            fi
            if [[ "$SG_ID" =~ ^sg-[a-f0-9]+$ ]]; then
              echo "SG_ID=$SG_ID" >> "$GITHUB_ENV"
              echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
              aws ec2 authorize-security-group-ingress \
                --group-id "$SG_ID" --protocol tcp --port 443 \
                --cidr "${RUNNER_IP}/32" --region "$AWS_REGION"
            else
              echo "::warning::No ALB security group found for $EKS_CLUSTER - staging may not be deployed yet"
            fi
          fi

      - name: Health endpoint returns 200 (with retries for sync lag)
        run: |
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 10 "$BASE_URL/api/health" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "health OK: $(cat /tmp/health.json)"
              exit 0
            fi
            echo "attempt $i: HTTP $CODE - retrying in 15s"
            sleep 15
          done
          echo "::error::/api/health never returned 200"
          exit 1

      - name: TLS certificate is valid for the hostname
        run: |
          echo | openssl s_client -connect "$HOSTNAME:443" -servername "$HOSTNAME" -verify_return_error 2>/dev/null \
            | openssl x509 -noout -subject -issuer -enddate
          echo | openssl s_client -connect "$HOSTNAME:443" -servername "$HOSTNAME" 2>/dev/null \
            | openssl x509 -noout -checkhost "$HOSTNAME" | grep -q "does match" \
            || { echo "::error::certificate does not match hostname"; exit 1; }

      - name: Database path works (bad login is rejected by the DB, not a 5xx)
        # Proves ingress -> backend -> Secrets Manager -> DocumentDB TLS in one call.
        # A 400/401 means the backend queried the DB and rejected the credentials;
        # a 5xx or timeout means the DB wiring is broken (today's failure mode).
        run: |
          CODE=$(curl -s -o /tmp/login.json -w '%{http_code}' --max-time 35 \
            -X POST "$BASE_URL/api/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"email":"cd-smoke-test@example.com","password":"wrong-on-purpose"}')
          echo "login probe: HTTP $CODE - $(cat /tmp/login.json)"
          case "$CODE" in
            400|401) echo "DB-backed rejection - connectivity OK" ;;
            2*) echo "::warning::login accepted bogus credentials (HTTP $CODE) - DB connectivity OK but check the backend auth logic" ;;
            *) echo "::error::got $CODE - DB wiring is likely broken (5xx/timeout was today's failure mode)"; exit 1 ;;
          esac

      - name: Send smoke tests status email
        if: always()
        uses: dawidd6/action-send-mail@v3
        env:
          JOB_TITLE: Smoke Tests
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: |
            [${{ github.repository }}]
            ${{ env.JOB_TITLE }} —
            ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }}
          html_body: |
            <!DOCTYPE html>
            <html lang="en">
            <head><meta charset="UTF-8"/></head>
            <body style="margin:0;padding:0;background:#f4f4f4;font-family:'Segoe UI',Arial,sans-serif;">
              <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f4;padding:32px 20px;">
                <tr>
                  <td align="center">
                    <table width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:10px;overflow:hidden;border:1px solid #e0e0e0;">
                      <tr>
                        <td style="background:${{ job.status == 'success' && '#1a7a1a' || '#8b0000' }};padding:24px 32px;">
                          <h1 style="margin:0;font-size:20px;font-weight:700;color:#ffffff;">
                            ${{ job.status == 'success' && '✅' || '❌' }} ${{ env.JOB_TITLE }} ${{ job.status == 'success' && 'Passed' || 'Failed' }}
                          </h1>
                          <p style="margin:6px 0 0 0;font-size:12px;color:rgba(255,255,255,0.7);">
                            Energy Drain CD — ${{ env.JOB_TITLE }}
                          </p>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:20px 32px;border-bottom:1px solid #eeeeee;">
                          <table cellpadding="0" cellspacing="0">
                            <tr>
                              <td style="background:${{ job.status == 'success' && '#e8f5e9' || '#fdecea' }};border:1px solid ${{ job.status == 'success' && '#a5d6a7' || '#f5c6c6' }};border-radius:6px;padding:10px 18px;">
                                <span style="font-size:13px;font-weight:600;color:${{ job.status == 'success' && '#2e7d32' || '#b71c1c' }};">
                                  🧪 ${{ env.JOB_TITLE }} — ${{ job.status == 'success' && 'All checks passed' || 'Checks failed' }}
                                </span>
                              </td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:16px 32px;border-bottom:1px solid #eeeeee;">
                          <table width="100%" cellpadding="0" cellspacing="0">
                            <tr>
                              <td style="padding:4px 0;font-size:12px;color:#888;width:110px;">Environment</td>
                              <td style="padding:4px 0;font-size:12px;color:#333;">staging.volt-app.dev</td>
                            </tr>
                            <tr>
                              <td style="padding:4px 0;font-size:12px;color:#888;">Commit</td>
                              <td style="padding:4px 0;font-size:12px;color:#333;font-family:monospace;">${{ github.sha }}</td>
                            </tr>
                            <tr>
                              <td style="padding:4px 0;font-size:12px;color:#888;">Trigger</td>
                              <td style="padding:4px 0;font-size:12px;color:#333;">${{ github.event_name }}</td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:20px 32px;">
                          <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                             style="display:inline-block;background:#1a1a1a;color:#ffffff;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:10px 24px;border-radius:6px;text-decoration:none;">
                            View Run →
                          </a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </body>
            </html>
          to: ${{ secrets.EMAIL_USERNAME }}
          from: GitOps CD

      - name: Revoke this runner's IP from the staging ALB
        if: always() && needs.setup.outputs.cluster_access == 'true'
        run: |
          if [ -n "$SG_ID" ] && [ "$SG_ID" != "None" ] && [ -n "$RUNNER_IP" ]; then
            aws ec2 revoke-security-group-ingress \
              --group-id "$SG_ID" --protocol tcp --port 443 \
              --cidr "${RUNNER_IP}/32" --region "$AWS_REGION" || true
          fi

  # ------------------------------------------------------- api acceptance --
  api-acceptance:
    name: API acceptance tests
    needs: [setup, smoke-tests]
    if: needs.setup.outputs.deploy_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write # for AWS OIDC (temporary staging ALB access)
    steps:
      - name: Configure AWS credentials (OIDC)
        if: needs.setup.outputs.cluster_access == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Authorize this runner's IP on the staging ALB (temporary)
        if: needs.setup.outputs.cluster_access == 'true'
        # RUNNER_IP/SG_ID are regex-validated immediately below before either
        # is written, closing the injection vector this rule flags -
        # zizmor's static analysis can't see that.
        run: | # zizmor: ignore[github-env]
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          if ! [[ "$RUNNER_IP" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo "::warning::could not determine a valid runner IP ($RUNNER_IP) - skipping ALB authorization"
          else
            aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION" > /dev/null
            ALB_DNS=$(kubectl get ingress -n "$APP_NAMESPACE" \
              -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
            SG_ID=""
            if [ -n "$ALB_DNS" ]; then
              CANDIDATE_SGS=$(aws elbv2 describe-load-balancers --region "$AWS_REGION" \
                --query "LoadBalancers[?DNSName=='${ALB_DNS}'].SecurityGroups[]" --output text)
              SG_ID=$(aws ec2 describe-security-groups --region "$AWS_REGION" \
                --group-ids $CANDIDATE_SGS \
                --filters "Name=tag:ingress.k8s.aws/resource,Values=ManagedLBSecurityGroup" \
                --query 'SecurityGroups[0].GroupId' --output text)
            fi
            if [[ "$SG_ID" =~ ^sg-[a-f0-9]+$ ]]; then
              echo "SG_ID=$SG_ID" >> "$GITHUB_ENV"
              echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
              aws ec2 authorize-security-group-ingress \
                --group-id "$SG_ID" --protocol tcp --port 443 \
                --cidr "${RUNNER_IP}/32" --region "$AWS_REGION"
            else
              echo "::warning::No ALB security group found for $EKS_CLUSTER - staging may not be deployed yet"
            fi
          fi

      - name: Auth config exposes the Google OAuth client ID
        # Empty client ID broke Google login on 2026-06-11; CI cannot catch it.
        run: |
          CID=$(curl -s --max-time 10 "$BASE_URL/api/auth/config" | python3 -c \
            'import json,sys; print(json.load(sys.stdin).get("google_client_id",""))')
          [ -n "$CID" ] || { echo "::error::google_client_id is empty in /api/auth/config"; exit 1; }
          echo "google_client_id present: ${CID%%-*}-..."

      - name: Google token verification endpoint rejects garbage credentials
        run: |
          CODE=$(curl -s -o /tmp/g.json -w '%{http_code}' --max-time 30 \
            -X POST "$BASE_URL/api/auth/google" \
            -H 'Content-Type: application/json' \
            -d '{"credential":"not-a-real-google-token"}')
          echo "google auth probe: HTTP $CODE - $(cat /tmp/g.json)"
          [ "$CODE" = "401" ] || { echo "::error::expected 401, got $CODE"; exit 1; }

      - name: Protected endpoints do not leak data without auth
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$BASE_URL/api/events")
          echo "/api/events unauthenticated: HTTP $CODE"
          case "$CODE" in
            401|403) echo "properly rejected" ;;
            2*) echo "::error::/api/events returned $CODE without auth - data leak"; exit 1 ;;
            5*) echo "::error::/api/events returned $CODE - server error"; exit 1 ;;
            *) echo "::warning::unexpected status $CODE (not blocking)" ;;
          esac

      - name: Malformed request bodies get a 4xx, not a 5xx
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
            -X POST "$BASE_URL/api/auth/login" \
            -H 'Content-Type: application/json' -d 'this is not json')
          echo "malformed body: HTTP $CODE"
          case "$CODE" in
            4*) echo "OK" ;;
            *) echo "::error::expected 4xx, got $CODE"; exit 1 ;;
          esac

      - name: Send API acceptance status email
        if: always()
        uses: dawidd6/action-send-mail@v3
        env:
          JOB_TITLE: API Acceptance Tests
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: |
            [${{ github.repository }}]
            ${{ env.JOB_TITLE }} —
            ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }}
          html_body: |
            <!DOCTYPE html>
            <html lang="en">
            <head><meta charset="UTF-8"/></head>
            <body style="margin:0;padding:0;background:#f4f4f4;font-family:'Segoe UI',Arial,sans-serif;">
              <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f4;padding:32px 20px;">
                <tr>
                  <td align="center">
                    <table width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:10px;overflow:hidden;border:1px solid #e0e0e0;">
                      <tr>
                        <td style="background:${{ job.status == 'success' && '#1a7a1a' || '#8b0000' }};padding:24px 32px;">
                          <h1 style="margin:0;font-size:20px;font-weight:700;color:#ffffff;">
                            ${{ job.status == 'success' && '✅' || '❌' }} ${{ env.JOB_TITLE }} ${{ job.status == 'success' && 'Passed' || 'Failed' }}
                          </h1>
                          <p style="margin:6px 0 0 0;font-size:12px;color:rgba(255,255,255,0.7);">
                            Energy Drain CD — ${{ env.JOB_TITLE }}
                          </p>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:20px 32px;border-bottom:1px solid #eeeeee;">
                          <table cellpadding="0" cellspacing="0">
                            <tr>
                              <td style="background:${{ job.status == 'success' && '#e8f5e9' || '#fdecea' }};border:1px solid ${{ job.status == 'success' && '#a5d6a7' || '#f5c6c6' }};border-radius:6px;padding:10px 18px;">
                                <span style="font-size:13px;font-weight:600;color:${{ job.status == 'success' && '#2e7d32' || '#b71c1c' }};">
                                  🧪 ${{ env.JOB_TITLE }} — ${{ job.status == 'success' && 'All checks passed' || 'Checks failed' }}
                                </span>
                              </td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:16px 32px;border-bottom:1px solid #eeeeee;">
                          <table width="100%" cellpadding="0" cellspacing="0">
                            <tr>
                              <td style="padding:4px 0;font-size:12px;color:#888;width:110px;">Environment</td>
                              <td style="padding:4px 0;font-size:12px;color:#333;">staging.volt-app.dev</td>
                            </tr>
                            <tr>
                              <td style="padding:4px 0;font-size:12px;color:#888;">Commit</td>
                              <td style="padding:4px 0;font-size:12px;color:#333;font-family:monospace;">${{ github.sha }}</td>
                            </tr>
                            <tr>
                              <td style="padding:4px 0;font-size:12px;color:#888;">Trigger</td>
                              <td style="padding:4px 0;font-size:12px;color:#333;">${{ github.event_name }}</td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:20px 32px;">
                          <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                             style="display:inline-block;background:#1a1a1a;color:#ffffff;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:10px 24px;border-radius:6px;text-decoration:none;">
                            View Run →
                          </a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </body>
            </html>
          to: ${{ secrets.EMAIL_USERNAME }}
          from: GitOps CD

      - name: Revoke this runner's IP from the staging ALB
        if: always() && needs.setup.outputs.cluster_access == 'true'
        run: |
          if [ -n "$SG_ID" ] && [ "$SG_ID" != "None" ] && [ -n "$RUNNER_IP" ]; then
            aws ec2 revoke-security-group-ingress \
              --group-id "$SG_ID" --protocol tcp --port 443 \
              --cidr "${RUNNER_IP}/32" --region "$AWS_REGION" || true
          fi

  # ----------------------------------------------------------- cert expiry --
  certificate-expiry:
    name: Certificate expiry check
    needs: setup
    if: needs.setup.outputs.deploy_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write # for AWS OIDC (temporary staging ALB access)
    steps:
      - name: Configure AWS credentials (OIDC)
        if: needs.setup.outputs.cluster_access == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Authorize this runner's IP on the staging ALB (temporary)
        if: needs.setup.outputs.cluster_access == 'true'
        # RUNNER_IP/SG_ID are regex-validated immediately below before either
        # is written, closing the injection vector this rule flags -
        # zizmor's static analysis can't see that.
        run: | # zizmor: ignore[github-env]
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          if ! [[ "$RUNNER_IP" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo "::warning::could not determine a valid runner IP ($RUNNER_IP) - skipping ALB authorization"
          else
            aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION" > /dev/null
            ALB_DNS=$(kubectl get ingress -n "$APP_NAMESPACE" \
              -o jsonpath='{.items[0].status.loadBalancer.ingress[0].hostname}' 2>/dev/null)
            SG_ID=""
            if [ -n "$ALB_DNS" ]; then
              CANDIDATE_SGS=$(aws elbv2 describe-load-balancers --region "$AWS_REGION" \
                --query "LoadBalancers[?DNSName=='${ALB_DNS}'].SecurityGroups[]" --output text)
              SG_ID=$(aws ec2 describe-security-groups --region "$AWS_REGION" \
                --group-ids $CANDIDATE_SGS \
                --filters "Name=tag:ingress.k8s.aws/resource,Values=ManagedLBSecurityGroup" \
                --query 'SecurityGroups[0].GroupId' --output text)
            fi
            if [[ "$SG_ID" =~ ^sg-[a-f0-9]+$ ]]; then
              echo "SG_ID=$SG_ID" >> "$GITHUB_ENV"
              echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
              aws ec2 authorize-security-group-ingress \
                --group-id "$SG_ID" --protocol tcp --port 443 \
                --cidr "${RUNNER_IP}/32" --region "$AWS_REGION"
            else
              echo "::warning::No ALB security group found for $EKS_CLUSTER - staging may not be deployed yet"
            fi
          fi

      - name: Certificate is valid for at least 30 more days
        # The ACM cert for this host was deleted once (2026-06-11) and took the
        # whole environment down; this catches expiry/replacement drift early.
        run: |
          END=$(echo | openssl s_client -connect "$HOSTNAME:443" -servername "$HOSTNAME" 2>/dev/null \
            | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
          if [ -z "$END" ]; then
            echo "::error::could not retrieve certificate from $HOSTNAME:443 - host may be unreachable or TLS is not serving"
            exit 1
          fi
          echo "certificate expires: $END"
          END_TS=$(date -d "$END" +%s 2>/dev/null)
          if [ -z "$END_TS" ]; then
            echo "::error::could not parse certificate expiry date: $END"
            exit 1
          fi
          NOW_TS=$(date +%s)
          DAYS=$(( (END_TS - NOW_TS) / 86400 ))
          echo "days remaining: $DAYS"
          if [ "$DAYS" -lt 30 ]; then
            echo "::error::certificate expires in $DAYS days (<30) - renew/rotate now"
            exit 1
          fi

