name: GitOps CD Tests

# CD tests validate the *deployed staging environment* - the wiring CI cannot
# see (real DocumentDB TLS, Secrets Manager values, ALB/DNS, OAuth config).
# CI already covers build, unit, integration and e2e tests of the code itself.
#
# Trigger model:
#   - Deploy path: runs 2 minutes after "GitOps CI Pipeline" succeeds on main
#     (smoke -> API acceptance + monitoring + cert expiry; rollback drill on
#     every 5th deploy).
#   - Weekly path: performance tests only, Mondays 06:00 UTC.
#   - Manual: workflow_dispatch lets you pick either suite.
#
# Cluster-dependent jobs (monitoring, rollback drill) authenticate to AWS via
# GitHub OIDC. They are skipped with a notice until the AWS_OIDC_ROLE_ARN
# secret is set (an IAM role trusting this repo, with eks:DescribeCluster and
# a Kubernetes RBAC mapping for kubectl).

on:
  workflow_run:
    workflows: ["GitOps CI Pipeline"]
    types: [completed]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC - weekly performance tests
  workflow_dispatch:
    inputs:
      mode:
        description: Which suite to run
        type: choice
        options:
          - deploy-tests
          - performance
        default: deploy-tests

permissions:
  contents: read
  id-token: write # for AWS OIDC in cluster-dependent jobs

env:
  BASE_URL: https://staging.volt-app.dev
  HOSTNAME: staging.volt-app.dev
  AWS_REGION: ap-south-1
  EKS_CLUSTER: energy-drain-staging
  ARGOCD_APP: energy-drain-staging
  APP_NAMESPACE: energy-drain-staging

jobs:
  # ---------------------------------------------------------------- setup --
  setup:
    name: Plan run & wait for ArgoCD
    runs-on: ubuntu-latest
    # Deploy path only when CI succeeded; schedule/dispatch always run.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      deploy_tests: ${{ steps.plan.outputs.deploy_tests }}
      performance: ${{ steps.plan.outputs.performance }}
      rollback_drill: ${{ steps.plan.outputs.rollback_drill }}
      cluster_access: ${{ steps.plan.outputs.cluster_access }}
    steps:
      - name: Decide which suites run
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          CI_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          HAS_AWS_ROLE: ${{ secrets.AWS_OIDC_ROLE_ARN != '' }}
        run: |
          DEPLOY=false PERF=false DRILL=false
          case "$EVENT" in
            workflow_run) DEPLOY=true ;;
            schedule) PERF=true ;;
            workflow_dispatch)
              if [ "$MODE" = "performance" ]; then PERF=true; else DEPLOY=true; fi ;;
          esac
          # Rollback drill on every 5th CI deploy (CI run number % 5 == 0)
          if [ "$DEPLOY" = true ] && [ -n "$CI_RUN_NUMBER" ] \
             && [ $((CI_RUN_NUMBER % 5)) -eq 0 ]; then
            DRILL=true
          fi
          {
            echo "deploy_tests=$DEPLOY"
            echo "performance=$PERF"
            echo "rollback_drill=$DRILL"
            echo "cluster_access=$HAS_AWS_ROLE"
          } >> "$GITHUB_OUTPUT"
          echo "deploy_tests=$DEPLOY performance=$PERF rollback_drill=$DRILL cluster_access=$HAS_AWS_ROLE"

      - name: Wait 2 minutes for ArgoCD to sync the new revision
        if: github.event_name == 'workflow_run'
        run: sleep 120

  # ---------------------------------------------------------------- smoke --
  smoke-tests:
    name: Smoke tests
    needs: setup
    if: needs.setup.outputs.deploy_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: DNS resolves
        run: |
          getent hosts "$HOSTNAME" || { echo "::error::DNS resolution failed for $HOSTNAME"; exit 1; }

      - name: Health endpoint returns 200 (with retries for sync lag)
        run: |
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 10 "$BASE_URL/api/health" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "health OK: $(cat /tmp/health.json)"
              exit 0
            fi
            echo "attempt $i: HTTP $CODE - retrying in 15s"
            sleep 15
          done
          echo "::error::/api/health never returned 200"
          exit 1

      - name: TLS certificate is valid for the hostname
        run: |
          echo | openssl s_client -connect "$HOSTNAME:443" -servername "$HOSTNAME" -verify_return_error 2>/dev/null \
            | openssl x509 -noout -subject -issuer -enddate
          echo | openssl s_client -connect "$HOSTNAME:443" -servername "$HOSTNAME" 2>/dev/null \
            | openssl x509 -noout -checkhost "$HOSTNAME" | grep -q "does match" \
            || { echo "::error::certificate does not match hostname"; exit 1; }

      - name: Database path works (bad login is rejected by the DB, not a 5xx)
        # Proves ingress -> backend -> Secrets Manager -> DocumentDB TLS in one call.
        # A 400/401 means the backend queried the DB and rejected the credentials;
        # a 5xx or timeout means the DB wiring is broken (today's failure mode).
        run: |
          CODE=$(curl -s -o /tmp/login.json -w '%{http_code}' --max-time 35 \
            -X POST "$BASE_URL/api/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"email":"cd-smoke-test@example.com","password":"wrong-on-purpose"}')
          echo "login probe: HTTP $CODE - $(cat /tmp/login.json)"
          case "$CODE" in
            400|401) echo "DB-backed rejection - connectivity OK" ;;
            2*) echo "::warning::login accepted bogus credentials (HTTP $CODE) - DB connectivity OK but check the backend auth logic" ;;
            *) echo "::error::got $CODE - DB wiring is likely broken (5xx/timeout was today's failure mode)"; exit 1 ;;
          esac

  # ------------------------------------------------------- api acceptance --
  api-acceptance:
    name: API acceptance tests
    needs: [setup, smoke-tests]
    if: needs.setup.outputs.deploy_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Auth config exposes the Google OAuth client ID
        # Empty client ID broke Google login on 2026-06-11; CI cannot catch it.
        run: |
          CID=$(curl -s --max-time 10 "$BASE_URL/api/auth/config" | python3 -c \
            'import json,sys; print(json.load(sys.stdin).get("google_client_id",""))')
          [ -n "$CID" ] || { echo "::error::google_client_id is empty in /api/auth/config"; exit 1; }
          echo "google_client_id present: ${CID%%-*}-..."

      - name: Google token verification endpoint rejects garbage credentials
        run: |
          CODE=$(curl -s -o /tmp/g.json -w '%{http_code}' --max-time 30 \
            -X POST "$BASE_URL/api/auth/google" \
            -H 'Content-Type: application/json' \
            -d '{"credential":"not-a-real-google-token"}')
          echo "google auth probe: HTTP $CODE - $(cat /tmp/g.json)"
          [ "$CODE" = "401" ] || { echo "::error::expected 401, got $CODE"; exit 1; }

      - name: Protected endpoints do not leak data without auth
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$BASE_URL/api/events")
          echo "/api/events unauthenticated: HTTP $CODE"
          case "$CODE" in
            401|403) echo "properly rejected" ;;
            2*) echo "::error::/api/events returned $CODE without auth - data leak"; exit 1 ;;
            5*) echo "::error::/api/events returned $CODE - server error"; exit 1 ;;
            *) echo "::warning::unexpected status $CODE (not blocking)" ;;
          esac

      - name: Malformed request bodies get a 4xx, not a 5xx
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
            -X POST "$BASE_URL/api/auth/login" \
            -H 'Content-Type: application/json' -d 'this is not json')
          echo "malformed body: HTTP $CODE"
          case "$CODE" in
            4*) echo "OK" ;;
            *) echo "::error::expected 4xx, got $CODE"; exit 1 ;;
          esac

  # ----------------------------------------------------------- cert expiry --
  certificate-expiry:
    name: Certificate expiry check
    needs: setup
    if: needs.setup.outputs.deploy_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Certificate is valid for at least 30 more days
        # The ACM cert for this host was deleted once (2026-06-11) and took the
        # whole environment down; this catches expiry/replacement drift early.
        run: |
          END=$(echo | openssl s_client -connect "$HOSTNAME:443" -servername "$HOSTNAME" 2>/dev/null \
            | openssl x509 -noout -enddate | cut -d= -f2)
          echo "certificate expires: $END"
          END_TS=$(date -d "$END" +%s)
          NOW_TS=$(date +%s)
          DAYS=$(( (END_TS - NOW_TS) / 86400 ))
          echo "days remaining: $DAYS"
          if [ "$DAYS" -lt 30 ]; then
            echo "::error::certificate expires in $DAYS days (<30) - renew/rotate now"
            exit 1
          fi

  # ------------------------------------------------------------ monitoring --
  monitoring-checks:
    name: Monitoring checks
    needs: [setup, smoke-tests]
    if: >-
      needs.setup.outputs.deploy_tests == 'true' &&
      needs.setup.outputs.cluster_access == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: ArgoCD application is Synced and Healthy
        run: |
          STATE=$(kubectl get application "$ARGOCD_APP" -n argocd \
            -o jsonpath='{.status.sync.status}/{.status.health.status}')
          echo "application state: $STATE"
          [ "$STATE" = "Synced/Healthy" ] || { echo "::error::app is $STATE"; exit 1; }

      - name: All app pods are Ready
        run: |
          kubectl get pods -n "$APP_NAMESPACE"
          NOT_READY=$(kubectl get pods -n "$APP_NAMESPACE" --no-headers \
            | awk '$2 !~ /^([0-9]+)\/\1$/ || $3 != "Running" {print $1}')
          [ -z "$NOT_READY" ] || { echo "::error::pods not ready: $NOT_READY"; exit 1; }

      - name: Prometheus is scraping the backend (target up)
        # Monitoring that silently breaks is worse than none - the whole stack
        # vanished once without any alert. Asserts the ServiceMonitor works.
        run: |
          kubectl -n monitoring port-forward svc/prometheus-kube-prometheus-prometheus 9090:9090 &
          PF_PID=$!
          trap 'kill $PF_PID' EXIT
          sleep 5
          UP=$(curl -s "http://localhost:9090/api/v1/query" \
            --data-urlencode "query=up{namespace=\"$APP_NAMESPACE\"}" \
            | python3 -c 'import json,sys; r=json.load(sys.stdin)["data"]["result"]; print(sum(int(s["value"][1]) for s in r), len(r))')
          echo "targets up/total in $APP_NAMESPACE: $UP"
          read -r UP_COUNT TOTAL <<< "$UP"
          if [ "${TOTAL:-0}" -eq 0 ]; then
            echo "::error::Prometheus has no targets in $APP_NAMESPACE - ServiceMonitor broken"
            exit 1
          fi
          if [ "$UP_COUNT" -lt "$TOTAL" ]; then
            echo "::error::only $UP_COUNT of $TOTAL targets are up"
            exit 1
          fi

  # -------------------------------------------------------- rollback drill --
  rollback-drill:
    name: Rollback drill (every 5th deploy)
    needs: [setup, smoke-tests, api-acceptance]
    if: >-
      needs.setup.outputs.rollback_drill == 'true' &&
      needs.setup.outputs.cluster_access == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Drill: break the deployment manually with a bad image tag and verify
    # ArgoCD selfHeal restores the git-defined state on its own. This proves
    # the recovery loop works BEFORE a real incident needs it.
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"

      - name: Record the git-defined image
        id: before
        run: |
          DEPLOY="deployment/${ARGOCD_APP}-energy-drain-app-backend"
          IMAGE=$(kubectl get "$DEPLOY" -n "$APP_NAMESPACE" \
            -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "deploy=$DEPLOY" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "current image: $IMAGE"

      - name: Inject drift (set a known-bad image tag)
        run: |
          kubectl set image -n "$APP_NAMESPACE" "${{ steps.before.outputs.deploy }}" \
            backend="${{ steps.before.outputs.image }}-rollback-drill-bad"

      - name: Verify ArgoCD selfHeal reverts the drift
        run: |
          for i in $(seq 1 60); do
            CURRENT=$(kubectl get "${{ steps.before.outputs.deploy }}" -n "$APP_NAMESPACE" \
              -o jsonpath='{.spec.template.spec.containers[0].image}')
            if [ "$CURRENT" = "${{ steps.before.outputs.image }}" ]; then
              echo "selfHeal restored the image after ~$((i*10))s"
              exit 0
            fi
            sleep 10
          done
          echo "::error::ArgoCD did not revert the drift within 10 minutes"
          echo "::error::manual fix: kubectl set image -n $APP_NAMESPACE ${{ steps.before.outputs.deploy }} backend=${{ steps.before.outputs.image }}"
          exit 1

      - name: Restore drift manually if the drill failed
        if: failure()
        run: |
          kubectl set image -n "$APP_NAMESPACE" "${{ steps.before.outputs.deploy }}" \
            backend="${{ steps.before.outputs.image }}" || true

      - name: App is healthy after the drill
        run: |
          kubectl rollout status -n "$APP_NAMESPACE" "${{ steps.before.outputs.deploy }}" --timeout=180s
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$BASE_URL/api/health")
          [ "$CODE" = "200" ] || { echo "::error::health check failed after drill: $CODE"; exit 1; }

  # ------------------------------------------------------------ performance --
  performance-tests:
    name: Performance tests (weekly)
    needs: setup
    if: needs.setup.outputs.performance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run k6 baseline against staging
        # Staging is small (1 replica), so thresholds are trend guards, not
        # capacity numbers - they catch regressions release over release.
        uses: grafana/run-k6-action@v1
        with:
          path: tests/cd/perf-baseline.js
        env:
          K6_BASE_URL: ${{ env.BASE_URL }}

  # ---------------------------------------------------------------- summary --
  summary:
    name: CD summary
    needs:
      - setup
      - smoke-tests
      - api-acceptance
      - certificate-expiry
      - monitoring-checks
      - rollback-drill
      - performance-tests
    if: always() && needs.setup.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          {
            echo "## CD test results"
            echo "| Suite | Result |"
            echo "|---|---|"
            echo "| Smoke tests | ${{ needs.smoke-tests.result }} |"
            echo "| API acceptance | ${{ needs.api-acceptance.result }} |"
            echo "| Certificate expiry | ${{ needs.certificate-expiry.result }} |"
            echo "| Monitoring checks | ${{ needs.monitoring-checks.result }} |"
            echo "| Rollback drill | ${{ needs.rollback-drill.result }} |"
            echo "| Performance | ${{ needs.performance-tests.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.setup.outputs.cluster_access }}" != "true" ]; then
            echo "::notice::monitoring & rollback-drill are skipped until the AWS_OIDC_ROLE_ARN secret is configured (IAM role with GitHub OIDC trust for this repo + EKS access)"
          fi
          for r in "${{ needs.smoke-tests.result }}" "${{ needs.api-acceptance.result }}" \
                   "${{ needs.certificate-expiry.result }}" "${{ needs.monitoring-checks.result }}" \
                   "${{ needs.rollback-drill.result }}" "${{ needs.performance-tests.result }}"; do
            [ "$r" = "failure" ] && exit 1
          done
          exit 0
