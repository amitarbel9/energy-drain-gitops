---
# ---------------------------------------------------------------------------
# GitOps CI Pipeline
#
# Triggered on every push to the main branch.
#
# Purpose:
# Validate Kubernetes + Helm + GitOps configuration BEFORE ArgoCD deploys it.
#
# Jobs (in order):
#
# 1. helm-lint
#    - Validate Helm chart syntax and templating
#
# 2. helm-template
#    - Render Kubernetes manifests from Helm templates
#    - Detect invalid YAML/template rendering issues
#
# 3. kubeconform
#    - Validate rendered manifests against Kubernetes schemas
#
# 4. yamllint
#    - Validate YAML formatting consistency
#
# 5. smoke-test
#    - Install Helm chart into a temporary Kind cluster
#    - Verify pods/services/ingress become healthy
#
# 6. notify
#    - Full pipeline summary email
#
# ---------------------------------------------------------------------------

name: GitOps CI Pipeline

on:
  push:
    branches:
      - main

# ---------------------------------------------------------------------------
# Least privilege permissions
# ---------------------------------------------------------------------------
permissions:
  contents: read

# ---------------------------------------------------------------------------
# Concurrency control
# Cancel outdated runs on new pushes
# ---------------------------------------------------------------------------
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # Job 1 — Helm Lint
  # ---------------------------------------------------------------------------
  helm-lint:
    name: Helm Lint — chart validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Run Helm lint
        run: |
          helm lint charts/lingua-app

      - name: Send helm lint status email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: |
            [${{ github.repository }}]
            Helm Lint —
            ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }}

          html_body: |
            <h2>
              ${{ job.status == 'success'
              && '✅ Helm lint passed'
              || '❌ Helm lint failed' }}
            </h2>

            <p>Repository: ${{ github.repository }}</p>
            <p>Branch: ${{ github.ref_name }}</p>
            <p>Commit: ${{ github.sha }}</p>

            <p>
              <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">
                View workflow run
              </a>
            </p>

          to: ${{ secrets.EMAIL_USERNAME }}
          from: GitOps CI

  # ---------------------------------------------------------------------------
  # Job 2 — Helm Template
  # ---------------------------------------------------------------------------
  helm-template:
    name: Helm Template — manifest rendering
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [helm-lint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Render manifests
        run: |
          helm template lingua-app charts/lingua-app \
            --namespace lingua-app \
            > rendered.yaml

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests
          path: rendered.yaml

      - name: Send helm template status email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: |
            [${{ github.repository }}]
            Helm Template —
            ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }}

          html_body: |
            <h2>
              ${{ job.status == 'success'
              && '✅ Helm template rendering passed'
              || '❌ Helm template rendering failed' }}
            </h2>

            <p>Repository: ${{ github.repository }}</p>
            <p>Branch: ${{ github.ref_name }}</p>

          to: ${{ secrets.EMAIL_USERNAME }}
          from: GitOps CI

  # ---------------------------------------------------------------------------
  # Job 3 — Kubernetes Schema Validation
  # ---------------------------------------------------------------------------
  kubeconform:
    name: Kubernetes Validation — kubeconform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [helm-template]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download rendered manifests
        uses: actions/download-artifact@v4
        with:
          name: rendered-manifests

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate manifests
        run: |
          kubeconform \
            -strict \
            -summary \
            rendered.yaml

      - name: Send kubeconform status email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: |
            [${{ github.repository }}]
            Kubernetes Validation —
            ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }}

          html_body: |
            <h2>
              ${{ job.status == 'success'
              && '✅ Kubernetes schema validation passed'
              || '❌ Kubernetes schema validation failed' }}
            </h2>

            <p>Rendered manifests were checked against Kubernetes schemas.</p>

          to: ${{ secrets.EMAIL_USERNAME }}
          from: GitOps CI

  # ---------------------------------------------------------------------------
  # Job 4 — YAML Linting
  # ---------------------------------------------------------------------------
  yamllint:
    name: YAML Lint — formatting validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [kubeconform]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install yamllint
        run: |
          pip install yamllint

      - name: Run yamllint
        run: |
          yamllint .

      - name: Send yamllint status email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: |
            [${{ github.repository }}]
            YAML Lint —
            ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }}

          html_body: |
            <h2>
              ${{ job.status == 'success'
              && '✅ YAML linting passed'
              || '❌ YAML linting failed' }}
            </h2>

            <p>YAML formatting consistency validated.</p>

          to: ${{ secrets.EMAIL_USERNAME }}
          from: GitOps CI

  # ---------------------------------------------------------------------------
  # Job 5 — Smoke Tests
  #
  # Creates a temporary Kind cluster and installs the Helm chart.
  # Validates:
  # - pods become Ready
  # - services exist
  # - ingress exists
  #
  # This catches runtime deployment issues BEFORE ArgoCD deploys.
  # ---------------------------------------------------------------------------
  smoke-test:
    name: Smoke Test — temporary Kubernetes deployment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [yamllint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Kind
        uses: helm/kind-action@v1.10.0

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Deploy Helm chart
        run: |
          helm install lingua-app charts/lingua-app \
            --namespace lingua-app \
            --create-namespace

      - name: Wait for deployment
        run: |
          kubectl wait \
            --for=condition=available \
            deployment \
            --all \
            -n lingua-app \
            --timeout=180s

      - name: Verify pods
        run: |
          kubectl get pods -n lingua-app

      - name: Verify services
        run: |
          kubectl get svc -n lingua-app

      - name: Verify ingress
        run: |
          kubectl get ingress -n lingua-app

      - name: Send smoke test status email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: |
            [${{ github.repository }}]
            Smoke Tests —
            ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }}

          html_body: |
            <h2>
              ${{ job.status == 'success'
              && '✅ Smoke tests passed'
              || '❌ Smoke tests failed' }}
            </h2>

            <p>
              Helm chart successfully deployed
              into temporary Kind cluster.
            </p>

          to: ${{ secrets.EMAIL_USERNAME }}
          from: GitOps CI

  # ---------------------------------------------------------------------------
  # Job 6 — Final Pipeline Summary
  # ---------------------------------------------------------------------------
  notify:
    name: Notify — pipeline summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()

    needs:
      - helm-lint
      - helm-template
      - kubeconform
      - yamllint
      - smoke-test

    steps:
      - name: Send final pipeline summary email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}

          subject: |
            [${{ github.repository }}]
            GitOps Pipeline —
            ${{
              (
                needs.helm-lint.result == 'success' &&
                needs.helm-template.result == 'success' &&
                needs.kubeconform.result == 'success' &&
                needs.yamllint.result == 'success' &&
                needs.smoke-test.result == 'success'
              )
              && '✅ Passed'
              || '❌ Failed'
            }}

          html_body: |
            <h1>GitOps CI Pipeline Summary</h1>

            <table border="1" cellpadding="8">
              <tr>
                <th>Stage</th>
                <th>Status</th>
              </tr>

              <tr>
                <td>Helm Lint</td>
                <td>${{ needs.helm-lint.result }}</td>
              </tr>

              <tr>
                <td>Helm Template</td>
                <td>${{ needs.helm-template.result }}</td>
              </tr>

              <tr>
                <td>Kubeconform</td>
                <td>${{ needs.kubeconform.result }}</td>
              </tr>

              <tr>
                <td>YAML Lint</td>
                <td>${{ needs.yamllint.result }}</td>
              </tr>

              <tr>
                <td>Smoke Test</td>
                <td>${{ needs.smoke-test.result }}</td>
              </tr>
            </table>

            <br>

            <p>
              <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">
                View workflow run
              </a>
            </p>

          to: ${{ secrets.EMAIL_USERNAME }}
          from: GitOps CI