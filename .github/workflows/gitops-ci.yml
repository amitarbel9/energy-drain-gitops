# ---------------------------------------------------------------------------
# GitOps CI Pipelines
#
# Triggered on every push to the main branch.
#
# Purpose:
# Validate Kubernetes + Helm + GitOps configuration BEFORE ArgoCD deploys it.
#
# Jobs (in order):
#
# 1. helm-lint
#    - Validate Helm chart syntax and templating
#
# 2. helm-template
#    - Render Kubernetes manifests from Helm templates
#    - Detect invalid YAML/template rendering issues
#
# 3. kubeconform
#    - Validate rendered manifests against Kubernetes schemas
#
# 4. yamllint
#    - Validate YAML formatting consistency
#
# 5. smoke-test
#    - Install Helm chart into a temporary Kind cluster
#    - Verify pods/services/ingress become healthy
#
# 6. notify
#    - Full pipeline summary email
#
# 7. promote
#    - Push validated changes to the staging branch
#    - ArgoCD running on the AWS staging environment watches this branch
#      and automatically syncs the Helm chart (using values-staging.yaml)
#
# ---------------------------------------------------------------------------

name: GitOps CI Pipeline

'on':
  push:
    branches:
      - main

# ---------------------------------------------------------------------------
# Least privilege permissions
# ---------------------------------------------------------------------------
permissions:
  contents: read

# ---------------------------------------------------------------------------
# Concurrency control
# Cancel outdated runs on new pushes
# ---------------------------------------------------------------------------
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # Job 1 — Helm Lint
  # ---------------------------------------------------------------------------
  helm-lint:
    name: Helm Lint — chart validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # This job never pushes with the checked-out credential - no
          # reason for it to persist in git config for the rest of the job.
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Run Helm lint
        run: |
          helm lint charts/energy-drain-app

      - name: Send helm lint status email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: |
            [${{ github.repository }}]
            Helm Lint —
            ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }}

          html_body: |
            <!DOCTYPE html>
            <html lang="en">
            <head><meta charset="UTF-8"/></head>
            <body style="margin:0;padding:0;background:#f4f4f4;font-family:'Segoe UI',Arial,sans-serif;">
              <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f4;padding:32px 20px;">
                <tr>
                  <td align="center">
                    <table width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:10px;overflow:hidden;border:1px solid #e0e0e0;">
                      <tr>
                        <td style="background:${{ job.status == 'success' && '#1a7a1a' || '#8b0000' }};padding:24px 32px;">
                          <h1 style="margin:0;font-size:20px;font-weight:700;color:#ffffff;">
                            ${{ job.status == 'success' && '✅ Helm Lint Passed' || '❌ Helm Lint Failed' }}
                          </h1>
                          <p style="margin:6px 0 0 0;font-size:12px;color:rgba(255,255,255,0.7);">
                            Energy Drain CI — Helm Lint
                          </p>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:20px 32px;border-bottom:1px solid #eeeeee;">
                          <table cellpadding="0" cellspacing="0">
                            <tr>
                              <td style="background:${{ job.status == 'success' && '#e8f5e9' || '#fdecea' }};border:1px solid ${{ job.status == 'success' && '#a5d6a7' || '#f5c6c6' }};border-radius:6px;padding:10px 18px;">
                                <span style="font-size:13px;font-weight:600;color:${{ job.status == 'success' && '#2e7d32' || '#b71c1c' }};">
                                  🔍 Helm Lint — ${{ job.status == 'success' && 'No issues found' || 'Issues detected' }}
                                </span>
                              </td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:16px 32px;border-bottom:1px solid #eeeeee;">
                          <table width="100%" cellpadding="0" cellspacing="0">
                            <tr>
                              <td style="padding:4px 0;font-size:12px;color:#888;width:110px;">Branch</td>
                              <td style="padding:4px 0;font-size:12px;color:#333;">${{ github.ref_name }}</td>
                            </tr>
                            <tr>
                              <td style="padding:4px 0;font-size:12px;color:#888;">Commit</td>
                              <td style="padding:4px 0;font-size:12px;color:#333;font-family:monospace;">${{ github.sha }}</td>
                            </tr>
                            <tr>
                              <td style="padding:4px 0;font-size:12px;color:#888;">Triggered by</td>
                              <td style="padding:4px 0;font-size:12px;color:#333;">${{ github.actor }}</td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:20px 32px;">
                          <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                             style="display:inline-block;background:#1a1a1a;color:#ffffff;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:10px 24px;border-radius:6px;text-decoration:none;">
                            View Run →
                          </a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </body>
            </html>

          to: ${{ secrets.EMAIL_USERNAME }}
          from: GitOps CI

  # ---------------------------------------------------------------------------
  # Job 2 — Helm Template
  # ---------------------------------------------------------------------------
  helm-template:
    name: Helm Template — manifest rendering
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [helm-lint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # This job never pushes with the checked-out credential - no
          # reason for it to persist in git config for the rest of the job.
          persist-credentials: false

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Render manifests
        run: |
          helm template energy-drain-app charts/energy-drain-app \
            --namespace energy-drain \
            > rendered.yaml

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests
          path: rendered.yaml

      - name: Send helm template status email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: |
            [${{ github.repository }}]
            Helm Template —
            ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }}

          html_body: |
            <!DOCTYPE html>
            <html lang="en">
            <head><meta charset="UTF-8"/></head>
            <body style="margin:0;padding:0;background:#f4f4f4;font-family:'Segoe UI',Arial,sans-serif;">
              <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f4;padding:32px 20px;">
                <tr>
                  <td align="center">
                    <table width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:10px;overflow:hidden;border:1px solid #e0e0e0;">
                      <tr>
                        <td style="background:${{ job.status == 'success' && '#1a7a1a' || '#8b0000' }};padding:24px 32px;">
                          <h1 style="margin:0;font-size:20px;font-weight:700;color:#ffffff;">
                            ${{ job.status == 'success' && '✅ Helm Template Passed' || '❌ Helm Template Failed' }}
                          </h1>
                          <p style="margin:6px 0 0 0;font-size:12px;color:rgba(255,255,255,0.7);">
                            Energy Drain CI — Helm Template
                          </p>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:20px 32px;border-bottom:1px solid #eeeeee;">
                          <table cellpadding="0" cellspacing="0">
                            <tr>
                              <td style="background:${{ job.status == 'success' && '#e8f5e9' || '#fdecea' }};border:1px solid ${{ job.status == 'success' && '#a5d6a7' || '#f5c6c6' }};border-radius:6px;padding:10px 18px;">
                                <span style="font-size:13px;font-weight:600;color:${{ job.status == 'success' && '#2e7d32' || '#b71c1c' }};">
                                  🔍 Helm Template — ${{ job.status == 'success' && 'No issues found' || 'Issues detected' }}
                                </span>
                              </td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:16px 32px;border-bottom:1px solid #eeeeee;">
                          <table width="100%" cellpadding="0" cellspacing="0">
                            <tr>
                              <td style="padding:4px 0;font-size:12px;color:#888;width:110px;">Branch</td>
                              <td style="padding:4px 0;font-size:12px;color:#333;">${{ github.ref_name }}</td>
                            </tr>
                            <tr>
                              <td style="padding:4px 0;font-size:12px;color:#888;">Commit</td>
                              <td style="padding:4px 0;font-size:12px;color:#333;font-family:monospace;">${{ github.sha }}</td>
                            </tr>
                            <tr>
                              <td style="padding:4px 0;font-size:12px;color:#888;">Triggered by</td>
                              <td style="padding:4px 0;font-size:12px;color:#333;">${{ github.actor }}</td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:20px 32px;">
                          <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                             style="display:inline-block;background:#1a1a1a;color:#ffffff;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:10px 24px;border-radius:6px;text-decoration:none;">
                            View Run →
                          </a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </body>
            </html>

          to: ${{ secrets.EMAIL_USERNAME }}
          from: GitOps CI

  # ---------------------------------------------------------------------------
  # Job 3 — Kubernetes Schema Validation
  # ---------------------------------------------------------------------------
  kubeconform:
    name: Kubernetes Validation — kubeconform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [helm-template]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # This job never pushes with the checked-out credential - no
          # reason for it to persist in git config for the rest of the job.
          persist-credentials: false

      - name: Download rendered manifests
        uses: actions/download-artifact@v4
        with:
          name: rendered-manifests

      - name: Install kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate manifests
        run: |
          kubeconform \
            -strict \
            -summary \
            -ignore-missing-schemas \
            rendered.yaml

      - name: Send kubeconform status email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: |
            [${{ github.repository }}]
            Kubernetes Validation —
            ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }}

          html_body: |
            <!DOCTYPE html>
            <html lang="en">
            <head><meta charset="UTF-8"/></head>
            <body style="margin:0;padding:0;background:#f4f4f4;font-family:'Segoe UI',Arial,sans-serif;">
              <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f4;padding:32px 20px;">
                <tr>
                  <td align="center">
                    <table width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:10px;overflow:hidden;border:1px solid #e0e0e0;">
                      <tr>
                        <td style="background:${{ job.status == 'success' && '#1a7a1a' || '#8b0000' }};padding:24px 32px;">
                          <h1 style="margin:0;font-size:20px;font-weight:700;color:#ffffff;">
                            ${{ job.status == 'success' && '✅ Validate Manifests Passed' || '❌ Validate Manifests Failed' }}
                          </h1>
                          <p style="margin:6px 0 0 0;font-size:12px;color:rgba(255,255,255,0.7);">
                            Energy Drain CI — Validate Manifests
                          </p>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:20px 32px;border-bottom:1px solid #eeeeee;">
                          <table cellpadding="0" cellspacing="0">
                            <tr>
                              <td style="background:${{ job.status == 'success' && '#e8f5e9' || '#fdecea' }};border:1px solid ${{ job.status == 'success' && '#a5d6a7' || '#f5c6c6' }};border-radius:6px;padding:10px 18px;">
                                <span style="font-size:13px;font-weight:600;color:${{ job.status == 'success' && '#2e7d32' || '#b71c1c' }};">
                                  🔍 kubeconform — ${{ job.status == 'success' && 'No issues found' || 'Issues detected' }}
                                </span>
                              </td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:16px 32px;border-bottom:1px solid #eeeeee;">
                          <table width="100%" cellpadding="0" cellspacing="0">
                            <tr>
                              <td style="padding:4px 0;font-size:12px;color:#888;width:110px;">Branch</td>
                              <td style="padding:4px 0;font-size:12px;color:#333;">${{ github.ref_name }}</td>
                            </tr>
                            <tr>
                              <td style="padding:4px 0;font-size:12px;color:#888;">Commit</td>
                              <td style="padding:4px 0;font-size:12px;color:#333;font-family:monospace;">${{ github.sha }}</td>
                            </tr>
                            <tr>
                              <td style="padding:4px 0;font-size:12px;color:#888;">Triggered by</td>
                              <td style="padding:4px 0;font-size:12px;color:#333;">${{ github.actor }}</td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:20px 32px;">
                          <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                             style="display:inline-block;background:#1a1a1a;color:#ffffff;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:10px 24px;border-radius:6px;text-decoration:none;">
                            View Run →
                          </a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </body>
            </html>

          to: ${{ secrets.EMAIL_USERNAME }}
          from: GitOps CI

  # ---------------------------------------------------------------------------
  # Job 4 — YAML Linting
  # ---------------------------------------------------------------------------
  yamllint:
    name: YAML Lint — formatting validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [kubeconform]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # This job never pushes with the checked-out credential - no
          # reason for it to persist in git config for the rest of the job.
          persist-credentials: false

      - name: Install yamllint
        run: |
          pip install yamllint

      - name: Run yamllint
        run: |
          yamllint \
          .github/workflows \
          charts/energy-drain-app/values.yaml

      - name: Send yamllint status email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: |
            [${{ github.repository }}]
            YAML Lint —
            ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }}

          html_body: |
            <!DOCTYPE html>
            <html lang="en">
            <head><meta charset="UTF-8"/></head>
            <body style="margin:0;padding:0;background:#f4f4f4;font-family:'Segoe UI',Arial,sans-serif;">
              <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f4;padding:32px 20px;">
                <tr>
                  <td align="center">
                    <table width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:10px;overflow:hidden;border:1px solid #e0e0e0;">
                      <tr>
                        <td style="background:${{ job.status == 'success' && '#1a7a1a' || '#8b0000' }};padding:24px 32px;">
                          <h1 style="margin:0;font-size:20px;font-weight:700;color:#ffffff;">
                            ${{ job.status == 'success' && '✅ Yamllint Passed' || '❌ Yamllint Failed' }}
                          </h1>
                          <p style="margin:6px 0 0 0;font-size:12px;color:rgba(255,255,255,0.7);">
                            Energy Drain CI — Yamllint
                          </p>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:20px 32px;border-bottom:1px solid #eeeeee;">
                          <table cellpadding="0" cellspacing="0">
                            <tr>
                              <td style="background:${{ job.status == 'success' && '#e8f5e9' || '#fdecea' }};border:1px solid ${{ job.status == 'success' && '#a5d6a7' || '#f5c6c6' }};border-radius:6px;padding:10px 18px;">
                                <span style="font-size:13px;font-weight:600;color:${{ job.status == 'success' && '#2e7d32' || '#b71c1c' }};">
                                  🔍 Yamllint — ${{ job.status == 'success' && 'No issues found' || 'Issues detected' }}
                                </span>
                              </td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:16px 32px;border-bottom:1px solid #eeeeee;">
                          <table width="100%" cellpadding="0" cellspacing="0">
                            <tr>
                              <td style="padding:4px 0;font-size:12px;color:#888;width:110px;">Branch</td>
                              <td style="padding:4px 0;font-size:12px;color:#333;">${{ github.ref_name }}</td>
                            </tr>
                            <tr>
                              <td style="padding:4px 0;font-size:12px;color:#888;">Commit</td>
                              <td style="padding:4px 0;font-size:12px;color:#333;font-family:monospace;">${{ github.sha }}</td>
                            </tr>
                            <tr>
                              <td style="padding:4px 0;font-size:12px;color:#888;">Triggered by</td>
                              <td style="padding:4px 0;font-size:12px;color:#333;">${{ github.actor }}</td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:20px 32px;">
                          <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                             style="display:inline-block;background:#1a1a1a;color:#ffffff;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:10px 24px;border-radius:6px;text-decoration:none;">
                            View Run →
                          </a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </body>
            </html>

          to: ${{ secrets.EMAIL_USERNAME }}
          from: GitOps CI

  # ---------------------------------------------------------------------------
  # Job 5 — Smoke Tests
  #
  # Creates a temporary Kind cluster and installs the Helm chart.
  # Validates:
  # - pods become Ready
  # - services exist
  # - ingress exists
  #
  # This catches runtime deployment issues BEFORE ArgoCD deploys.
  # ---------------------------------------------------------------------------
  smoke-test:
    name: Smoke Test — temporary Kubernetes deployment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [yamllint]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # This job never pushes with the checked-out credential - no
          # reason for it to persist in git config for the rest of the job.
          persist-credentials: false

      - name: Install Kind
        uses: helm/kind-action@v1.10.0

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Deploy Helm chart
        run: |
          helm install energy-drain-app charts/energy-drain-app \
            --namespace energy-drain \
            --create-namespace \
            --set monitoring.enabled=false

      - name: Debug Kubernetes resources
        run: |
          echo "================ PODS ================"
          kubectl get pods -n energy-drain

          echo "================ DESCRIBE PODS ================"
          kubectl describe pods -n energy-drain

          echo "================ EVENTS ================"
          kubectl get events -n energy-drain --sort-by=.metadata.creationTimestamp

          echo "================ BACKEND LOGS ================"
          kubectl logs deployment/energy-drain-app-backend -n energy-drain || true

          echo "================ NGINX LOGS ================"
          kubectl logs deployment/energy-drain-app-nginx -n energy-drain || true

      - name: Wait for deployment
        run: |
          kubectl wait \
            --for=condition=available \
            deployment \
            --all \
            -n energy-drain \
            --timeout=180s

      - name: Verify pods
        run: |
          kubectl get pods -n energy-drain

      - name: Verify services
        run: |
          kubectl get svc -n energy-drain

      - name: Verify ingress
        run: |
          kubectl get ingress -n energy-drain

      - name: Send smoke test status email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: |
            [${{ github.repository }}]
            Smoke Tests —
            ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }}

          html_body: |
            <!DOCTYPE html>
            <html lang="en">
            <head><meta charset="UTF-8"/></head>
            <body style="margin:0;padding:0;background:#f4f4f4;font-family:'Segoe UI',Arial,sans-serif;">
              <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f4;padding:32px 20px;">
                <tr>
                  <td align="center">
                    <table width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:10px;overflow:hidden;border:1px solid #e0e0e0;">
                      <tr>
                        <td style="background:${{ job.status == 'success' && '#1a7a1a' || '#8b0000' }};padding:24px 32px;">
                          <h1 style="margin:0;font-size:20px;font-weight:700;color:#ffffff;">
                            ${{ job.status == 'success' && '✅ Smoke Tests Passed' || '❌ Smoke Tests Failed' }}
                          </h1>
                          <p style="margin:6px 0 0 0;font-size:12px;color:rgba(255,255,255,0.7);">
                            Energy Drain CI — Smoke Tests
                          </p>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:20px 32px;border-bottom:1px solid #eeeeee;">
                          <table cellpadding="0" cellspacing="0">
                            <tr>
                              <td style="background:${{ job.status == 'success' && '#e8f5e9' || '#fdecea' }};border:1px solid ${{ job.status == 'success' && '#a5d6a7' || '#f5c6c6' }};border-radius:6px;padding:10px 18px;">
                                <span style="font-size:13px;font-weight:600;color:${{ job.status == 'success' && '#2e7d32' || '#b71c1c' }};">
                                  🔍 Smoke Tests — ${{ job.status == 'success' && 'No issues found' || 'Issues detected' }}
                                </span>
                              </td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                      <tr>
