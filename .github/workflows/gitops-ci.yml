  # ---------------------------------------------------------------------------
  # Job 7 — Promote to Staging + ArgoCD Sync Notification
  # ---------------------------------------------------------------------------
  promote:
    name: Promote — staging branch + ArgoCD sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: success()
    permissions:
      contents: write

    needs:
      - helm-lint
      - helm-template
      - kubeconform
      - yamllint
      - smoke-test
      - secret-scan
      - iac-scan
      - workflow-scan

    steps:
      - name: Checkout repository
        # zizmor: ignore[artipacked] this job's whole job is to `git push`
        # the checked-out credential to the staging branch further down -
        # persist-credentials: false would break that push, since it relies
        # on the ambient credential checkout leaves in git config.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
      - name: Fetch all branches
        run: |
          git fetch origin
      - name: Promote main to staging
        run: |
          git checkout -B staging origin/main
          git push origin staging --force

      - name: Send ArgoCD sync notification email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: |
            [${{ github.repository }}]
            ArgoCD —
            ${{ job.status == 'success' && '✅ Staging Branch Updated' || '❌ Sync Failed' }}

          html_body: |
            <!DOCTYPE html>
            <html lang="en">
            <head><meta charset="UTF-8"/></head>
            <body style="margin:0;padding:0;background:#f4f4f4;font-family:'Segoe UI',Arial,sans-serif;">
