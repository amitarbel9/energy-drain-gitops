          version: v3.16.2

      - name: Render manifests
        run: |
          helm template energy-drain-app charts/energy-drain-app \
            --namespace energy-drain \
            > rendered.yaml

      - name: Upload rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests
          path: rendered.yaml

      - name: Send helm template status email
        if: always()
        uses: dawidd6/action-send-mail@v3
