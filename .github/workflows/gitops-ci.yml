  # ---------------------------------------------------------------------------
  # Job 6 — Final Pipeline Summary
  # ---------------------------------------------------------------------------
  notify:
    name: Notify — pipeline summary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: always()

    needs:
      - helm-lint
      - helm-template
      - kubeconform
      - yamllint
      - smoke-test

    steps:
      - name: Send final pipeline summary email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}

          subject: |
            [${{ github.repository }}]
            GitOps Pipeline —
            ${{
              (
                needs.helm-lint.result == 'success' &&
                needs.helm-template.result == 'success' &&
                needs.kubeconform.result == 'success' &&
                needs.yamllint.result == 'success' &&
                needs.smoke-test.result == 'success'
              )
              && '✅ Passed'
              || '❌ Failed'
            }}

          html_body: |
            <!DOCTYPE html>
            <html lang="en">
            <head><meta charset="UTF-8"/></head>
            <body style="margin:0;padding:0;background:#f4f4f4;font-family:'Segoe UI',Arial,sans-serif;">
              <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f4;padding:40px 20px;">
                <tr>
                  <td align="center">
                    <table width="560" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:10px;overflow:hidden;border:1px solid #e0e0e0;">
                      <tr>
                        <td style="background:${{ (needs.helm-lint.result == 'success' && needs.helm-template.result == 'success' && needs.kubeconform.result == 'success' && needs.yamllint.result == 'success' && needs.smoke-test.result == 'success') && '#1a7a1a' || '#8b0000' }};padding:28px 36px;">
                          <h1 style="margin:0;font-size:22px;font-weight:700;color:#ffffff;">
                            ${{ (needs.helm-lint.result == 'success' && needs.helm-template.result == 'success' && needs.kubeconform.result == 'success' && needs.yamllint.result == 'success' && needs.smoke-test.result == 'success') && '✅ Pipeline Passed' || '❌ Pipeline Failed' }}
                          </h1>
                          <p style="margin:6px 0 0 0;font-size:13px;color:rgba(255,255,255,0.75);">
                            GitOps CI Pipeline — Full Summary
                          </p>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:24px 36px;border-bottom:1px solid #eeeeee;">
                          <p style="margin:0 0 14px 0;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#999;">Stages</p>
                          <table width="100%" cellpadding="0" cellspacing="0" style="border:1px solid #eeeeee;border-radius:8px;overflow:hidden;">
                            <tr style="background:#fafafa;">
                              <td style="padding:12px 20px;font-size:13px;color:#333;border-bottom:1px solid #eeeeee;">🔍 Helm Lint — Chart Validation</td>
                              <td align="right" style="padding:12px 20px;font-size:13px;font-weight:600;color:${{ needs.helm-lint.result == 'success' && '#2e7d32' || '#b71c1c' }};border-bottom:1px solid #eeeeee;">
                                ${{ needs.helm-lint.result == 'success' && '✅ PASSED' || needs.helm-lint.result == 'skipped' && '⏭️ SKIPPED' || '❌ FAILED' }}
                              </td>
                            </tr>
                            <tr style="background:#ffffff;">
                              <td style="padding:12px 20px;font-size:13px;color:#333;border-bottom:1px solid #eeeeee;">🧪 Helm Template — Chart Rendering</td>
                              <td align="right" style="padding:12px 20px;font-size:13px;font-weight:600;color:${{ needs.helm-template.result == 'success' && '#2e7d32' || '#b71c1c' }};border-bottom:1px solid #eeeeee;">
                                ${{ needs.helm-template.result == 'success' && '✅ PASSED' || needs.helm-template.result == 'skipped' && '⏭️ SKIPPED' || '❌ FAILED' }}
                              </td>
                            </tr>
                            <tr style="background:#fafafa;">
                              <td style="padding:12px 20px;font-size:13px;color:#333;border-bottom:1px solid #eeeeee;">📦 Kubeconform — Kubernetes Manifest Validation</td>
                              <td align="right" style="padding:12px 20px;font-size:13px;font-weight:600;color:${{ needs.kubeconform.result == 'success' && '#2e7d32' || '#b71c1c' }};border-bottom:1px solid #eeeeee;">
                                ${{ needs.kubeconform.result == 'success' && '✅ PASSED' || needs.kubeconform.result == 'skipped' && '⏭️ SKIPPED' || '❌ FAILED' }}
                              </td>
                            </tr>
                            <tr style="background:#ffffff;">
                              <td style="padding:12px 20px;font-size:13px;color:#333;border-bottom:1px solid #eeeeee;">🔗 YamlLint — YAML Syntax Validation</td>
                              <td align="right" style="padding:12px 20px;font-size:13px;font-weight:600;color:${{ needs.yamllint.result == 'success' && '#2e7d32' || '#b71c1c' }};border-bottom:1px solid #eeeeee;">
                                ${{ needs.yamllint.result == 'success' && '✅ PASSED' || needs.yamllint.result == 'skipped' && '⏭️ SKIPPED' || '❌ FAILED' }}
                              </td>
                            </tr>
                            <tr style="background:#fafafa;">
                              <td style="padding:12px 20px;font-size:13px;color:#333;">🌐 Smoke Tests — Application Validation</td>
                              <td align="right" style="padding:12px 20px;font-size:13px;font-weight:600;color:${{ needs.smoke-test.result == 'success' && '#2e7d32' || '#b71c1c' }};">${{ needs.smoke-test.result == 'success' && '✅ PASSED' || needs.smoke-test.result == 'skipped' && '⏭️ SKIPPED' || '❌ FAILED' }}</td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:24px 36px;border-bottom:1px solid #eeeeee;">
                          <p style="margin:0 0 14px 0;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#999;">Run Details</p>
                          <table width="100%" cellpadding="0" cellspacing="0">
                            <tr>
                              <td style="padding:6px 0;font-size:13px;color:#888;width:130px;">Repository</td>
                              <td style="padding:6px 0;font-size:13px;color:#333;">${{ github.repository }}</td>
                            </tr>
                            <tr>
                              <td style="padding:6px 0;font-size:13px;color:#888;">Branch</td>
                              <td style="padding:6px 0;font-size:13px;color:#333;">${{ github.ref_name }}</td>
                            </tr>
                            <tr>
                              <td style="padding:6px 0;font-size:13px;color:#888;">Commit</td>
                              <td style="padding:6px 0;font-size:13px;color:#333;font-family:monospace;">${{ github.sha }}</td>
                            </tr>
                            <tr>
                              <td style="padding:6px 0;font-size:13px;color:#888;">Triggered by</td>
                              <td style="padding:6px 0;font-size:13px;color:#333;">${{ github.actor }}</td>
                            </tr>
                            <tr>
                              <td style="padding:6px 0;font-size:13px;color:#888;">Run ID</td>
                              <td style="padding:6px 0;font-size:13px;color:#333;font-family:monospace;">${{ github.run_id }}</td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:24px 36px;border-bottom:1px solid #eeeeee;">
                          <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                             style="display:inline-block;background:#1a1a1a;color:#ffffff;font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:12px 28px;border-radius:6px;text-decoration:none;">
                            View Full Run →
                          </a>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:16px 36px;background:#fafafa;">
                          <p style="margin:0;font-size:11px;color:#aaa;">
                            Energy Drain CI · Automated pipeline report · ${{ github.repository }}
                          </p>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </body>
            </html>

          to: ${{ secrets.EMAIL_USERNAME }}
          from: GitOps CI

  # ---------------------------------------------------------------------------
  # Job 7 — Promote to Production + ArgoCD Sync Notification
  # ---------------------------------------------------------------------------
  promote:
    name: Promote — local branch + ArgoCD sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: success()

    needs:
      - helm-lint
      - helm-template
      - kubeconform
      - yamllint
      - smoke-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
      - name: Fetch all branches
        run: |
          git fetch origin
      - name: Checkout local branch
        run: |
          git checkout -B local origin/local
      - name: Promote main to local
        run: |
          git merge origin/main --no-edit
          git push origin local

      - name: Send ArgoCD sync notification email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: |
            [${{ github.repository }}]
            ArgoCD —
            ${{ job.status == 'success' && '✅ Repository Pulled Locally' || '❌ Sync Failed' }}

          html_body: |
            <!DOCTYPE html>
            <html lang="en">
            <head><meta charset="UTF-8"/></head>
            <body style="margin:0;padding:0;background:#f4f4f4;font-family:'Segoe UI',Arial,sans-serif;">
              <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f4;padding:32px 20px;">
                <tr>
                  <td align="center">
                    <table width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:10px;overflow:hidden;border:1px solid #e0e0e0;">
                      <tr>
                        <td style="background:${{ job.status == 'success' && '#1a7a1a' || '#8b0000' }};padding:24px 32px;">
                          <h1 style="margin:0;font-size:20px;font-weight:700;color:#ffffff;">
                            ${{ job.status == 'success' && '✅ ArgoCD Pulled Repo Locally' || '❌ ArgoCD Sync Failed' }}
                          </h1>
                          <p style="margin:6px 0 0 0;font-size:12px;color:rgba(255,255,255,0.7);">
                            Energy Drain CI — ArgoCD Sync
                          </p>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:20px 32px;border-bottom:1px solid #eeeeee;">
                          <table cellpadding="0" cellspacing="0">
                            <tr>
                              <td style="background:${{ job.status == 'success' && '#e8f5e9' || '#fdecea' }};border:1px solid ${{ job.status == 'success' && '#a5d6a7' || '#f5c6c6' }};border-radius:6px;padding:10px 18px;">
                                <span style="font-size:13px;font-weight:600;color:${{ job.status == 'success' && '#2e7d32' || '#b71c1c' }};">
                                  🔄 ArgoCD — ${{ job.status == 'success' && 'Repository pulled and applied to local cluster' || 'Sync encountered issues' }}
                                </span>
                              </td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:16px 32px;border-bottom:1px solid #eeeeee;">
                          <table width="100%" cellpadding="0" cellspacing="0">
                            <tr>
                              <td style="padding:4px 0;font-size:12px;color:#888;width:110px;">Branch</td>
                              <td style="padding:4px 0;font-size:12px;color:#333;">${{ github.ref_name }}</td>
                            </tr>
                            <tr>
                              <td style="padding:4px 0;font-size:12px;color:#888;">Commit</td>
                              <td style="padding:4px 0;font-size:12px;color:#333;font-family:monospace;">${{ github.sha }}</td>
                            </tr>
                            <tr>
                              <td style="padding:4px 0;font-size:12px;color:#888;">Triggered by</td>
                              <td style="padding:4px 0;font-size:12px;color:#333;">${{ github.actor }}</td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:20px 32px;">
                          <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                             style="display:inline-block;background:#1a1a1a;color:#ffffff;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:10px 24px;border-radius:6px;text-decoration:none;">
                            View Run →
                          </a>
                        </td>
                      </tr>
                    </table>
                  </td>
