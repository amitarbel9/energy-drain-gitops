name: Promote to Production

# Manual production deployment - running this workflow IS the approval.
# (Required-reviewer environment gates need GitHub Pro on private repos,
# so promotion is a deliberate human-triggered workflow instead.)
#
# By default it promotes the commit validated by the most recent fully
# successful CD test run - NOT the tip of main, which may contain newer
# untested commits. It fast-forwards the production branch; prod ArgoCD
# (auto-sync on that branch) deploys from inside the cluster, so CI never
# holds production credentials. Rollback = move the branch pointer back.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA to promote (leave empty = latest CD-tested commit)
        required: false
        default: ""

permissions:
  contents: read
  actions: read # to look up the latest successful CD run

env:
  PROD_URL: https://volt-app.dev
  PROD_HOST: volt-app.dev

jobs:
  promote:
    name: Fast-forward production branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: production-promotion
    steps:
      - name: Resolve the SHA to promote
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          if [ -n "$INPUT_SHA" ]; then
            SHA="$INPUT_SHA"
            echo "using explicitly requested SHA"
          else
            SHA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/gitops-cd.yml/runs?status=success&event=workflow_run&per_page=1" \
              | python3 -c 'import json,sys; runs=json.load(sys.stdin)["workflow_runs"]; print(runs[0]["head_sha"] if runs else "")')
            if [ -z "$SHA" ]; then
              echo "::error::no fully successful CD test run found - wait for CD tests to pass, or pass a SHA explicitly"
              exit 1
            fi
            echo "using SHA from the latest fully successful CD run"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "promoting: $SHA"

      - name: Checkout (full history, push-capable token)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Sync image tags and fast-forward production branch
        run: |
          TESTED_SHA="${{ steps.resolve.outputs.sha }}"
          echo "production currently at: $(git rev-parse origin/production)"
          echo "promoting tested SHA: $TESTED_SHA"

          # Work on the tested commit in a detached HEAD so we can optionally
          # add a tag-sync commit on top before pushing to production.
          git checkout "$TESTED_SHA"
          git config user.email "gitops-promote@ci"
          git config user.name "Promote to Production"

          # Read image tags from values-staging.yaml at this exact tested SHA.
          # These are the tags that passed all CD tests - they are what
          # production should run. This eliminates manually maintained tags in
          # values-prod.yaml that go stale whenever ECR images are deleted.
          BACKEND_TAG=$(grep -A3 'repository:.*energy-backend' \
            charts/energy-drain-app/values-staging.yaml \
            | grep 'tag:' | head -1 | awk '{print $2}' | tr -d '"')
          NGINX_TAG=$(grep -A3 'repository:.*energy-drain-nginx' \
            charts/energy-drain-app/values-staging.yaml \
            | grep 'tag:' | head -1 | awk '{print $2}' | tr -d '"')

          echo "syncing tags to production: backend=$BACKEND_TAG nginx=$NGINX_TAG"

          python3 - charts/energy-drain-app/values-prod.yaml \
              "$BACKEND_TAG" "$NGINX_TAG" <<'PY'
          import sys, re
          path, backend_tag, nginx_tag = sys.argv[1], sys.argv[2], sys.argv[3]
          content = open(path).read()
          content = re.sub(
              r'(repository:.*energy-backend[^\n]*\n\s*tag:\s*)[^\n]+',
              r'\g<1>"' + backend_tag + '"', content)
          content = re.sub(
              r'(repository:.*energy-drain-nginx[^\n]*\n\s*tag:\s*)[^\n]+',
              r'\g<1>"' + nginx_tag + '"', content)
          open(path, 'w').write(content)
          PY

          git add charts/energy-drain-app/values-prod.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(production): sync image tags from tested staging SHA ($BACKEND_TAG)"
            echo "committed tag sync: backend=$BACKEND_TAG nginx=$NGINX_TAG"
          else
            echo "tags already up to date, no sync commit needed"
          fi

          git push origin HEAD:refs/heads/production
          echo "production branch updated - ArgoCD deploys within ~3 minutes"

      - name: Send production promotion status email
        if: always()
        uses: dawidd6/action-send-mail@v3
        env:
          JOB_TITLE: Production Promotion
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: |
            [${{ github.repository }}]
            ${{ env.JOB_TITLE }} —
            ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }}
          html_body: |
            <!DOCTYPE html>
            <html lang="en">
            <head><meta charset="UTF-8"/></head>
            <body style="margin:0;padding:0;background:#f4f4f4;font-family:'Segoe UI',Arial,sans-serif;">
              <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f4;padding:32px 20px;">
                <tr>
                  <td align="center">
                    <table width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:10px;overflow:hidden;border:1px solid #e0e0e0;">
                      <tr>
                        <td style="background:${{ job.status == 'success' && '#1a7a1a' || '#8b0000' }};padding:24px 32px;">
                          <h1 style="margin:0;font-size:20px;font-weight:700;color:#ffffff;">
                            ${{ job.status == 'success' && '✅' || '❌' }} ${{ env.JOB_TITLE }} ${{ job.status == 'success' && 'Passed' || 'Failed' }}
                          </h1>
                          <p style="margin:6px 0 0 0;font-size:12px;color:rgba(255,255,255,0.7);">
                            Energy Drain CD — ${{ env.JOB_TITLE }}
                          </p>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:20px 32px;border-bottom:1px solid #eeeeee;">
                          <table cellpadding="0" cellspacing="0">
                            <tr>
                              <td style="background:${{ job.status == 'success' && '#e8f5e9' || '#fdecea' }};border:1px solid ${{ job.status == 'success' && '#a5d6a7' || '#f5c6c6' }};border-radius:6px;padding:10px 18px;">
                                <span style="font-size:13px;font-weight:600;color:${{ job.status == 'success' && '#2e7d32' || '#b71c1c' }};">
                                  🧪 ${{ env.JOB_TITLE }} — ${{ job.status == 'success' && 'All checks passed' || 'Checks failed' }}
                                </span>
                              </td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:16px 32px;border-bottom:1px solid #eeeeee;">
                          <table width="100%" cellpadding="0" cellspacing="0">
                            <tr>
                              <td style="padding:4px 0;font-size:12px;color:#888;width:110px;">Environment</td>
                              <td style="padding:4px 0;font-size:12px;color:#333;">volt-app.dev (production)</td>
                            </tr>
                            <tr>
                              <td style="padding:4px 0;font-size:12px;color:#888;">Commit</td>
                              <td style="padding:4px 0;font-size:12px;color:#333;font-family:monospace;">${{ github.sha }}</td>
                            </tr>
                            <tr>
                              <td style="padding:4px 0;font-size:12px;color:#888;">Trigger</td>
                              <td style="padding:4px 0;font-size:12px;color:#333;">${{ github.event_name }}</td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:20px 32px;">
                          <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                             style="display:inline-block;background:#1a1a1a;color:#ffffff;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:10px 24px;border-radius:6px;text-decoration:none;">
                            View Run →
                          </a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </body>
            </html>
          to: ${{ secrets.EMAIL_USERNAME }}
          from: GitOps CD

  production-smoke:
    name: Production smoke tests (post-promotion)
    needs: promote
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check production DNS resolves (skip smoke tests if infra is not up)
        id: dns
        run: |
          if getent hosts "$PROD_HOST" >/dev/null 2>&1; then
            echo "DNS resolves - running smoke tests"
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$PROD_HOST does not resolve - production infrastructure is not deployed yet. Run 'terraform apply' for production to bring it up. Smoke tests skipped."
            echo "reachable=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Health endpoint (allow time for ArgoCD poll + rollout)
        if: steps.dns.outputs.reachable == 'true'
        run: |
          for i in $(seq 1 32); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$PROD_URL/api/health" || echo 000)
            [ "$CODE" = "200" ] && { echo "health OK after $((i*15))s"; exit 0; }
            sleep 15
          done
          echo "::error::production /api/health did not return 200 within 8 minutes"
          exit 1

      - name: TLS certificate matches the production hostname
        if: steps.dns.outputs.reachable == 'true'
        run: |
          echo | openssl s_client -connect "$PROD_HOST:443" -servername "$PROD_HOST" 2>/dev/null \
            | openssl x509 -noout -checkhost "$PROD_HOST" | grep -q "does match" \
            || { echo "::error::certificate does not match $PROD_HOST"; exit 1; }

      - name: Database path answers (no 5xx from DB-backed endpoint)
        if: steps.dns.outputs.reachable == 'true'
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 35 \
            -X POST "$PROD_URL/api/auth/login" \
            -H 'Content-Type: application/json' \
            -d '{"email":"cd-prod-smoke@example.com","password":"wrong-on-purpose"}')
          echo "login probe: HTTP $CODE"
          case "$CODE" in
            5*|000) echo "::error::production DB wiring is broken (HTTP $CODE)"; exit 1 ;;
            *) echo "DB answered - connectivity OK" ;;
          esac

      - name: Auth config exposes the Google OAuth client ID
        if: steps.dns.outputs.reachable == 'true'
        run: |
          CID=$(curl -s --max-time 10 "$PROD_URL/api/auth/config" | python3 -c \
            'import json,sys; print(json.load(sys.stdin).get("google_client_id",""))')
          [ -n "$CID" ] || { echo "::error::google_client_id empty in production"; exit 1; }
          echo "google_client_id present"

      - name: Send production smoke status email
        if: always()
        uses: dawidd6/action-send-mail@v3
        env:
          JOB_TITLE: Production Smoke Tests
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: |
            [${{ github.repository }}]
            ${{ env.JOB_TITLE }} —
            ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }}
          html_body: |
            <!DOCTYPE html>
            <html lang="en">
            <head><meta charset="UTF-8"/></head>
            <body style="margin:0;padding:0;background:#f4f4f4;font-family:'Segoe UI',Arial,sans-serif;">
              <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f4;padding:32px 20px;">
                <tr>
                  <td align="center">
                    <table width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:10px;overflow:hidden;border:1px solid #e0e0e0;">
                      <tr>
                        <td style="background:${{ job.status == 'success' && '#1a7a1a' || '#8b0000' }};padding:24px 32px;">
                          <h1 style="margin:0;font-size:20px;font-weight:700;color:#ffffff;">
                            ${{ job.status == 'success' && '✅' || '❌' }} ${{ env.JOB_TITLE }} ${{ job.status == 'success' && 'Passed' || 'Failed' }}
                          </h1>
                          <p style="margin:6px 0 0 0;font-size:12px;color:rgba(255,255,255,0.7);">
                            Energy Drain CD — ${{ env.JOB_TITLE }}
                          </p>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:20px 32px;border-bottom:1px solid #eeeeee;">
                          <table cellpadding="0" cellspacing="0">
                            <tr>
                              <td style="background:${{ job.status == 'success' && '#e8f5e9' || '#fdecea' }};border:1px solid ${{ job.status == 'success' && '#a5d6a7' || '#f5c6c6' }};border-radius:6px;padding:10px 18px;">
                                <span style="font-size:13px;font-weight:600;color:${{ job.status == 'success' && '#2e7d32' || '#b71c1c' }};">
                                  🧪 ${{ env.JOB_TITLE }} — ${{ job.status == 'success' && 'All checks passed' || 'Checks failed' }}
                                </span>
                              </td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:16px 32px;border-bottom:1px solid #eeeeee;">
                          <table width="100%" cellpadding="0" cellspacing="0">
                            <tr>
                              <td style="padding:4px 0;font-size:12px;color:#888;width:110px;">Environment</td>
                              <td style="padding:4px 0;font-size:12px;color:#333;">volt-app.dev (production)</td>
                            </tr>
                            <tr>
                              <td style="padding:4px 0;font-size:12px;color:#888;">Commit</td>
                              <td style="padding:4px 0;font-size:12px;color:#333;font-family:monospace;">${{ github.sha }}</td>
                            </tr>
                            <tr>
                              <td style="padding:4px 0;font-size:12px;color:#888;">Trigger</td>
                              <td style="padding:4px 0;font-size:12px;color:#333;">${{ github.event_name }}</td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                      <tr>
                        <td style="padding:20px 32px;">
                          <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                             style="display:inline-block;background:#1a1a1a;color:#ffffff;font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:10px 24px;border-radius:6px;text-decoration:none;">
                            View Run →
                          </a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </body>
            </html>
          to: ${{ secrets.EMAIL_USERNAME }}
          from: GitOps CD
