# Production Application - applied to the ArgoCD instance running on the
# energy-drain-production cluster.
#
# Tracks the "production" branch: a fast-forward-only pointer to the last
# CD-tested commit of main that an admin approved. Nobody commits to this
# branch directly - the promote-production job in gitops-cd.yml moves it
# after the GitHub "production" environment approval (the human gate).
# Sync is automated here because the approval already happened in the
# pipeline; rollback = move the production branch back one commit.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: energy-drain-production
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mild-byte/energy-drain-gitops.git
    targetRevision: production
    path: charts/energy-drain-app
    helm:
      valueFiles:
        - values.yaml
        - values-production.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: energy-drain-production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
