apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lingua-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/mild-byte/language-learninga-gitops
    targetRevision: local
    path: charts/lingua-app
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: lingua-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
