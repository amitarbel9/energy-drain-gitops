# values-production.yaml overrides base values for production deployments.
# This file is applied after values.yaml when using `helm install -f`.
#
# IMPORTANT: namespace.name must stay "energy-drain-production" - the IRSA
# trust policy of energy-drain-production-secrets-csi only allows the
# energy-drain-backend ServiceAccount in that exact namespace.

namespace:
  name: energy-drain-production
backend:
  replicas: 3
  image:
    repository: 523555653711.dkr.ecr.ap-south-1.amazonaws.com/energy-backend
    # DO NOT edit this tag manually. The Promote to Production workflow writes
    # it automatically from values-staging.yaml at promotion time, keeping it
    # in sync with the staging-validated build.
    tag: "0fd252b"
  # MONGO_URL base comes from AWS Secrets Manager via the Secrets Store CSI
  # driver (see secretsStore below); the chart appends tlsCAFile itself.
  database:
    mongoUrl: ""
  serviceAccount:
    create: true
    name: energy-drain-backend
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::523555653711:role/energy-drain-production-secrets-csi"
  secretsStore:
    enabled: true
    secretProviderClassName: energy-drain-production-backend-secrets
    awsSecretName: "production/energy-drain/mongo-url"
    k8sSecretName: energy-drain-backend-db-secret
  # DocumentDB requires TLS verification against the Amazon RDS CA bundle.
  # The chart appends tlsCAFile=<mountPath>/global-bundle.pem to MONGO_URL.
  docdbCa:
    enabled: true
    configMapName: energy-drain-docdb-ca
    mountPath: "/etc/ssl/docdb"
  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"
  env:
    - name: AWS_REGION
      value: "ap-south-1"
    - name: ENVIRONMENT
      value: "production"
    - name: LOG_LEVEL
      value: "warn"
    # Google OAuth client ID (public identifier, not a secret) used by the
    # frontend Sign-In button via /api/auth/config. The OAuth client must
    # list https://volt-app.dev under Authorized JavaScript origins.
    - name: GOOGLE_CLIENT_ID
      value: "373082865022-7j13og8l3jvkgvp1cii0cr9iqgerb98u.apps.googleusercontent.com"
nginx:
  replicas: 2
  image:
    repository: 523555653711.dkr.ecr.ap-south-1.amazonaws.com/energy-drain-nginx
    # DO NOT edit - managed by Promote to Production workflow (see backend note)
    tag: "0fd252b"
  service:
    type: LoadBalancer
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"
ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:523555653711:certificate/88a590e4-9e5e-4837-a4f8-9755d70f1424
  hosts:
    - host: volt-app.dev
      paths:
        - path: /
          pathType: Prefix
  tls: []
monitoring:
  serviceMonitor:
    enabled: true
