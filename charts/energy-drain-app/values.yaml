# Default values for the energy-drain-app chart.
# These defaults are used by `helm install` and can be overridden
# by `-f` files or `--set` values.

namespace:
  # namespace.name is the Kubernetes namespace for all chart resources
  name: energy-drain
  # namespace.create controls whether Helm creates this namespace
  create: true
backend:
  imagePullSecrets: []
  # backend.serviceAccount controls the ServiceAccount used by backend pods.
  # Used for IRSA (IAM Roles for Service Accounts) to grant access to AWS Secrets Manager.
  serviceAccount:
    create: false
    name: ""
    annotations: {}
    # automount is false because the backend never calls the Kubernetes API
    # itself - MONGO_URL reaches it via env-var injection from the Secrets
    # Store CSI driver, which requires no API calls from inside the pod.
    # There's no reason to hand it a token it will never use.
    automount: false
  # backend.secretsStore configures the AWS Secrets Store CSI driver to fetch
  # the database connection string from AWS Secrets Manager.
  secretsStore:
    enabled: false
    secretProviderClassName: ""
    awsSecretName: ""
    k8sSecretName: ""
  # backend.docdbCa mounts the Amazon RDS/DocumentDB CA bundle (files/global-bundle.pem)
  # into the pod so pymongo can verify the DocumentDB TLS certificate.
  # MONGO_URL must reference it via tlsCAFile=<mountPath>/global-bundle.pem.
  docdbCa:
    enabled: false
    configMapName: ""
    mountPath: "/etc/ssl/docdb"
  # backend.name is the base name for backend Deployment and Service
  name: backend
  # backend.replicas is the desired replica count for the backend pods
  replicas: 1
  image:
    # backend.image.repository is the backend image repository
    repository: ghcr.io/mild-byte/energy-backend
    # backend.image.tag is the backend image tag
    tag: "c73d2d9"
    # backend.image.pullPolicy controls imagePullPolicy
    pullPolicy: IfNotPresent
  # backend.port is the port the backend listens on
  port: 5000
  # backend.database.mongoUrl is the database connection string
  database:
    mongoUrl: "mongodb://mongodb:27017"
  healthCheck:
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
    liveness:
      initialDelaySeconds: 20
      periodSeconds: 10
      timeoutSeconds: 5
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  # backend.env is an optional list of extra environment variables
  env: []
nginx:
  imagePullSecrets: []
  # nginx.serviceAccount.name defaults to "<release>-nginx" if left empty.
  # nginx gets its own ServiceAccount (instead of the namespace's "default")
  # purely so it never shares an identity with anything else that might
  # later get RBAC permissions bound to "default" in this namespace.
  serviceAccount:
    name: ""
  # nginx.name is the base name for nginx Deployment and Service
  name: nginx
  # nginx.replicas is the desired replica count for nginx pods
  replicas: 1
  image:
    # nginx.image.repository is the nginx image repository
    repository: ghcr.io/mild-byte/energy-drain-nginx
    # nginx.image.tag is the nginx image tag
    tag: "c73d2d9"
    # nginx.image.pullPolicy controls imagePullPolicy
    pullPolicy: IfNotPresent
  # nginx.port is the HTTP port exposed by nginx
  port: 80
  service:
    # nginx.service.type is the Kubernetes Service type for nginx
    type: ClusterIP
  healthCheck:
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
    liveness:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
# Ingress configuration for optional hostname routing and TLS support
ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  hosts:
    - host: energy-drain.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
monitoring:
  enabled: true
  interval: 30s
  path: /metrics
  serviceMonitor:
    enabled: true
# networkPolicy applies default-deny + narrow allow-lists at the pod network
# level: only nginx may reach backend, only backend may reach the database,
# and nothing gets DNS or any other traffic unless explicitly listed here.
# Off by default - local/Kind dev has no real VPC/DocumentDB, and Kind's
# default CNI (kindnet) doesn't enforce NetworkPolicy at all, so there'd be
# nothing to verify. Enabled explicitly in values-staging.yaml/
# values-production.yaml, where the cluster's CNI actually enforces it
# (confirmed: EKS VPC CNI, NETWORK_POLICY_ENFORCING_MODE=standard).
networkPolicy:
  enabled: false
  # vpcCidr scopes the backend's DocumentDB egress rule to only the
  # cluster's own VPC, instead of leaving that port open to the internet -
  # DocumentDB is never meant to be reached from outside the VPC anyway.
  vpcCidr: ""
