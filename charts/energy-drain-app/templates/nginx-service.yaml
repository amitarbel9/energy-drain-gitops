# Service exposing nginx either as NodePort or LoadBalancer.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "energy-drain.fullname" . }}-nginx-service
  namespace: {{ .Values.namespace.name }}
  labels:
{{ include "energy-drain.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  selector:
{{ include "energy-drain.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
  ports:
    - protocol: TCP
      port: {{ .Values.nginx.port }}
      targetPort: {{ .Values.nginx.port }}
      {{- if eq .Values.nginx.service.type "NodePort" }}
      nodePort: {{ .Values.nginx.service.nodePort }}
      {{- end }}
  type: {{ .Values.nginx.service.type }}
