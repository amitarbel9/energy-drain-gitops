{{- if .Values.ingress.enabled }}
# Ingress routes external requests to the nginx Service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "energy-drain.fullname" . }}-ingress
  namespace: {{ .Values.namespace.name }}
  labels:
{{ include "energy-drain.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "energy-drain.fullname" $ }}-nginx-service
                port:
                  number: {{ $.Values.nginx.port }}
          {{- end }}
    {{- end }}
{{- end }}
