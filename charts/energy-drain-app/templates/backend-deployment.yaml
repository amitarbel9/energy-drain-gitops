# Backend Deployment for the lingua-app backend service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "energy-drain.fullname" . }}-backend
  namespace: {{ .Values.namespace.name }}
  labels:
{{ include "energy-drain.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
{{ include "energy-drain.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
{{ include "energy-drain.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      {{- with .Values.backend.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Values.backend.name }}
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.port }}
          env:
            - name: MONGO_URL
              value: "{{ .Values.backend.database.mongoUrl }}"
{{- with .Values.backend.env }}
{{- toYaml . | nindent 12 }}
{{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: {{ .Values.backend.healthCheck.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.healthCheck.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.healthCheck.readiness.timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: {{ .Values.backend.healthCheck.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.healthCheck.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.healthCheck.liveness.timeoutSeconds }}
          resources:
            requests:
              memory: "{{ .Values.backend.resources.requests.memory }}"
              cpu: "{{ .Values.backend.resources.requests.cpu }}"
            limits:
              memory: "{{ .Values.backend.resources.limits.memory }}"
              cpu: "{{ .Values.backend.resources.limits.cpu }}"
