# Backend Deployment for the lingua-app backend service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "energy-drain.fullname" . }}-backend
  namespace: {{ .Values.namespace.name }}
  labels:
{{ include "energy-drain.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
{{ include "energy-drain.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
{{ include "energy-drain.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      {{- if .Values.backend.serviceAccount.create }}
      serviceAccountName: {{ .Values.backend.serviceAccount.name }}
      {{- end }}
      {{- with .Values.backend.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Set here too, not just on the ServiceAccount object itself - both
      # achieve the same result today, but this is the belt-and-suspenders
      # version that stays correct even if this Deployment is ever pointed
      # at a different ServiceAccount later.
      automountServiceAccountToken: false
      # runAsUser is forced explicitly (not just runAsNonRoot) because
      # different image tags actually differ here - the currently-deployed
      # staging tag runs as uid=100 by default, but the chart's own base
      # values.yaml tag defaults to root. Forcing the known-good uid means
      # this doesn't silently depend on whichever tag happens to be set.
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ .Values.backend.name }}
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: {{ .Values.backend.port }}
          env:
            {{- if .Values.backend.secretsStore.enabled }}
            {{- if .Values.backend.docdbCa.enabled }}
            # The secret holds only the base connection string. The tlsCAFile
            # param is appended here because the chart owns the CA mount path;
            # keeping it out of the secret means recreating the secret cannot
            # break TLS verification. The base URL must end with a query string
            # (e.g. ?tls=true&retryWrites=false) - see scripts/set-staging-mongo-secret.sh.
            - name: MONGO_URL_BASE
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.secretsStore.k8sSecretName }}
                  key: MONGO_URL
            - name: MONGO_URL
              value: "$(MONGO_URL_BASE)&tlsCAFile={{ .Values.backend.docdbCa.mountPath }}/global-bundle.pem"
            {{- else }}
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.secretsStore.k8sSecretName }}
                  key: MONGO_URL
            {{- end }}
            {{- else }}
            - name: MONGO_URL
              value: "{{ .Values.backend.database.mongoUrl }}"
            {{- end }}
{{- with .Values.backend.env }}
{{- toYaml . | nindent 12 }}
{{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: {{ .Values.backend.healthCheck.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.healthCheck.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.healthCheck.readiness.timeoutSeconds }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.backend.port }}
            initialDelaySeconds: {{ .Values.backend.healthCheck.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.backend.healthCheck.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.backend.healthCheck.liveness.timeoutSeconds }}
          resources:
            requests:
              memory: "{{ .Values.backend.resources.requests.memory }}"
              cpu: "{{ .Values.backend.resources.requests.cpu }}"
            limits:
              memory: "{{ .Values.backend.resources.limits.memory }}"
              cpu: "{{ .Values.backend.resources.limits.cpu }}"
          volumeMounts:
            # Scratch space for a process that now has readOnlyRootFilesystem.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.backend.secretsStore.enabled }}
            - name: secrets-store
              mountPath: "/mnt/secrets-store"
              readOnly: true
            {{- end }}
            {{- if .Values.backend.docdbCa.enabled }}
            - name: docdb-ca
              mountPath: "{{ .Values.backend.docdbCa.mountPath }}"
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.backend.secretsStore.enabled }}
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ .Values.backend.secretsStore.secretProviderClassName }}
        {{- end }}
        {{- if .Values.backend.docdbCa.enabled }}
        - name: docdb-ca
          configMap:
            name: {{ .Values.backend.docdbCa.configMapName }}
        {{- end }}
