{{- if .Values.backend.secretsStore.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.backend.secretsStore.secretProviderClassName }}
  namespace: {{ .Values.namespace.name }}
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "{{ .Values.backend.secretsStore.awsSecretName }}"
        objectType: "secretsmanager"
        objectAlias: "MONGO_URL"
  secretObjects:
    - secretName: {{ .Values.backend.secretsStore.k8sSecretName }}
      type: Opaque
      data:
        - objectName: "MONGO_URL"
          key: MONGO_URL
{{- end }}
