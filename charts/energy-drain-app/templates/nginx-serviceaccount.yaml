# Dedicated ServiceAccount for nginx pods, instead of implicitly using the
# namespace's "default" ServiceAccount. nginx only proxies HTTP to the
# backend and never calls the Kubernetes API, so its token is never mounted.
# Giving it its own identity also means it can never inherit permissions
# that get bound to "default" for an unrelated reason later.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "energy-drain.nginxServiceAccountName" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
{{ include "energy-drain.labels" . | nindent 4 }}
automountServiceAccountToken: false
