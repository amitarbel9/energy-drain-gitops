# values-staging.yaml overrides base values for staging deployments.
# This file is applied after values.yaml when using `helm install -f`.

namespace:
  name: energy-drain-staging
backend:
  replicas: 1
  image:
    repository: 523555653711.dkr.ecr.ap-south-1.amazonaws.com/energy-backend
    tag: "3397892"
  # In staging, connect to a managed MongoDB or AWS-backed database
  database:
    mongoUrl: "mongodb://mongodb-staging.c123abc456.mongodb.net:27017"
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  env:
    - name: AWS_REGION
      value: "us-east-1"
    - name: ENVIRONMENT
      value: "staging"
    - name: LOG_LEVEL
      value: "info"
nginx:
  replicas: 1
  image:
    repository: 523555653711.dkr.ecr.ap-south-1.amazonaws.com/energy-drain-nginx
    tag: "3397892"
  service:
    type: LoadBalancer
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:523555653711:certificate/6f2c0fd2-064c-4832-9013-2724c6e92d78
  hosts:
    - host: staging.volt-app.dev
      paths:
        - path: /
          pathType: Prefix
  tls: []
monitoring:
  serviceMonitor:
    enabled: true
