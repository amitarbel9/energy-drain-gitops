# values-staging.yaml overrides base values for staging deployments.
# This file is applied after values.yaml when using `helm install -f`.

namespace:
  name: energy-drain-staging
backend:
  replicas: 1
  image:
    repository: 523555653711.dkr.ecr.ap-south-1.amazonaws.com/energy-backend
    tag: "3397892"
  # MONGO_URL is fetched from AWS Secrets Manager via the Secrets Store CSI
  # driver (see secretsStore below) - this value is unused when enabled.
  database:
    mongoUrl: ""
  serviceAccount:
    create: true
    name: energy-drain-backend
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::523555653711:role/energy-drain-staging-secrets-csi"
  secretsStore:
    enabled: true
    secretProviderClassName: energy-drain-staging-backend-secrets
    awsSecretName: "staging/energy-drain/mongo-url"
    k8sSecretName: energy-drain-backend-db-secret
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  env:
    - name: AWS_REGION
      value: "ap-south-1"
    - name: ENVIRONMENT
      value: "staging"
    - name: LOG_LEVEL
      value: "info"
nginx:
  replicas: 1
  image:
    repository: 523555653711.dkr.ecr.ap-south-1.amazonaws.com/energy-drain-nginx
    tag: "3397892"
  service:
    type: LoadBalancer
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:523555653711:certificate/6f2c0fd2-064c-4832-9013-2724c6e92d78
  hosts:
    - host: staging.volt-app.dev
      paths:
        - path: /
          pathType: Prefix
  tls: []
monitoring:
  serviceMonitor:
    enabled: true
