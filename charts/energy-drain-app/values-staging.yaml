# values-staging.yaml overrides base values for staging deployments.
# This file is applied after values.yaml when using `helm install -f`.

namespace:
  name: energy-drain-staging
backend:
  replicas: 1
  image:
    repository: 523555653711.dkr.ecr.ap-south-1.amazonaws.com/energy-backend
    tag: "0f65e23"
  # MONGO_URL is fetched from AWS Secrets Manager via the Secrets Store CSI
  # driver (see secretsStore below) - this value is unused when enabled.
  database:
    mongoUrl: ""
  serviceAccount:
    create: true
    name: energy-drain-backend
    annotations:
      eks.amazonaws.com/role-arn: "arn:aws:iam::523555653711:role/energy-drain-staging-secrets-csi"
  secretsStore:
    enabled: true
    secretProviderClassName: energy-drain-staging-backend-secrets
    awsSecretName: "staging/energy-drain/mongo-url"
    k8sSecretName: energy-drain-backend-db-secret
  # DocumentDB requires TLS verification against the Amazon RDS CA bundle.
  # The connection string in Secrets Manager references it via
  # tlsCAFile=/etc/ssl/docdb/global-bundle.pem
  docdbCa:
    enabled: true
    configMapName: energy-drain-docdb-ca
    mountPath: "/etc/ssl/docdb"
  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  env:
    - name: AWS_REGION
      value: "ap-south-1"
    - name: ENVIRONMENT
      value: "staging"
    - name: LOG_LEVEL
      value: "info"
    # Google OAuth client ID (public identifier, not a secret) used by the
    # frontend Sign-In button via /api/auth/config and for ID token audience
    # verification in POST /api/auth/google.
    - name: GOOGLE_CLIENT_ID
      value: "373082865022-7j13og8l3jvkgvp1cii0cr9iqgerb98u.apps.googleusercontent.com"
nginx:
  replicas: 1
  image:
    repository: 523555653711.dkr.ecr.ap-south-1.amazonaws.com/energy-drain-nginx
    tag: "0f65e23"
  service:
    type: LoadBalancer
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"
ingress:
  enabled: true
  className: "alb"
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-south-1:523555653711:certificate/7ae65c52-04da-41ed-b9a5-a92a9d46cd8a
    # Staging is restricted to a single known IP - unlike production, there's
    # no reason for the public internet to reach it, and it's otherwise a
    # 24/7 target for scanners/bots (the hostname is discoverable via public
    # Certificate Transparency logs regardless of whether it's linked
    # anywhere). Update this if the IP changes - most ISP connections are
    # dynamic, so this will need revisiting if staging access breaks.
    alb.ingress.kubernetes.io/inbound-cidrs: 176.228.207.87/32
  hosts:
    - host: staging.volt-app.dev
      paths:
        - path: /
          pathType: Prefix
  tls: []
monitoring:
  serviceMonitor:
    enabled: true
# NOTE: the policies render and apply cleanly, but as of 2026-07-05 aren't
# actually enforced yet - this cluster's aws-node (self-managed Helm install,
# not the EKS-managed vpc-cni add-on) has enable-network-policy-controller
# set to false, and its ClusterRole is missing the RBAC to watch
# networking.k8s.io/networkpolicies. Confirmed live: a test default-deny
# policy did not block traffic, and zero PolicyEndpoint objects were ever
# created. Fixing this is real cluster infrastructure work (likely
# migrating to the EKS-managed add-on), not something this chart can do -
# left enabled here so it activates automatically once that's fixed.
networkPolicy:
  enabled: true
  vpcCidr: "10.0.0.0/16"
